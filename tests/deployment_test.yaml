suite: deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/configmap-skills.yaml
  - templates/configmap-workspace.yaml
  - templates/configmap-workspace-content.yaml
set:
  agentName: testbot
  existingSecret: devpod-secrets
tests:
  - it: should create a Deployment
    asserts:
      - isKind:
          of: Deployment
        template: templates/deployment.yaml

  - it: should set correct name and namespace
    asserts:
      - equal:
          path: metadata.name
          value: testbot-devpod
        template: templates/deployment.yaml
      - equal:
          path: metadata.namespace
          value: devpod-testbot
        template: templates/deployment.yaml

  - it: should use default image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: your-registry/openclaw:latest
        template: templates/deployment.yaml

  - it: should use custom image when set
    set:
      image:
        repository: custom-registry/openclaw
        tag: v1.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom-registry/openclaw:v1.0.0"
        template: templates/deployment.yaml

  - it: should set resource requests and limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "512Mi"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "3Gi"
        template: templates/deployment.yaml

  - it: should set custom resources
    set:
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "4Gi"
          cpu: "4000m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "1Gi"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "4Gi"
        template: templates/deployment.yaml

  - it: should have startup probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 18789
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 5
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
        template: templates/deployment.yaml

  - it: should have liveness probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 18789
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
        template: templates/deployment.yaml

  - it: should mount PVC when persistence enabled
    set:
      persistence:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: testbot-data
        template: templates/deployment.yaml

  - it: should use emptyDir when persistence disabled
    set:
      persistence:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        template: templates/deployment.yaml

  - it: should mount skills volume when skills defined
    set:
      skills:
        test.md: "test content"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skills
            mountPath: /config/skills
            readOnly: true
        template: templates/deployment.yaml

  - it: should not mount skills volume when no skills
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skills
            mountPath: /config/skills
            readOnly: true
        template: templates/deployment.yaml

  - it: should set serviceAccountName when rbac enabled
    set:
      rbac:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: testbot-devpod
        template: templates/deployment.yaml

  - it: should mount extra configmaps
    set:
      extraConfigMaps:
        - name: agents-registry
          mountPath: /config/agents
          data:
            agents.json: "{}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-agents-registry
            mountPath: /config/agents
            readOnly: true
        template: templates/deployment.yaml

  - it: should include extra env vars
    set:
      extraEnv:
        - name: CUSTOM_VAR
          value: "custom-value"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: "custom-value"
        template: templates/deployment.yaml

  - it: should mount workspace volume when workspaceFiles defined
    set:
      workspaceFiles:
        - path: CLAUDE.md
          url: "http://minio.example.com/bucket/workspace/abc/CLAUDE.md?sig=xxx"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace
            mountPath: /config/workspace
            readOnly: true
        template: templates/deployment.yaml

  - it: should not mount workspace volume when no workspaceFiles
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace
            mountPath: /config/workspace
            readOnly: true
        template: templates/deployment.yaml

  - it: should include workspace configmap volume when workspaceFiles defined
    set:
      workspaceFiles:
        - path: CLAUDE.md
          url: "http://minio.example.com/bucket/workspace/abc/CLAUDE.md?sig=xxx"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: workspace
            configMap:
              name: testbot-workspace
        template: templates/deployment.yaml

  - it: should mount workspace-content volume when workspaceContent defined
    set:
      workspaceContent:
        AGENTS.md: "test content"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace-content
            mountPath: /config/workspace-content
            readOnly: true
        template: templates/deployment.yaml

  - it: should not mount workspace-content volume when no workspaceContent
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace-content
            mountPath: /config/workspace-content
            readOnly: true
        template: templates/deployment.yaml

  - it: should include workspace-content configmap volume when workspaceContent defined
    set:
      workspaceContent:
        AGENTS.md: "test content"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: workspace-content
            configMap:
              name: testbot-workspace-content
        template: templates/deployment.yaml

  - it: should bootstrap anthropic oauth auth-profiles by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'Bootstrap agent auth from Claude credentials'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"anthropic:claude-cli":\{"type":"oauth","provider":"anthropic"'
        template: templates/deployment.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"type":"api_key"'
        template: templates/deployment.yaml

  - it: should bootstrap openrouter api_key auth-profiles when provider is openrouter
    set:
      agent:
        auth:
          provider: openrouter
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'printenv "OPENROUTER_API_KEY"'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"openrouter:default" :\{"type":"api_key","provider":"openrouter","key":\$key\}'
        template: templates/deployment.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'claudeAiOauth'
        template: templates/deployment.yaml

  - it: should add teams to the channel-strip allowlist when teams enabled
    set:
      channels:
        teams:
          enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "ALLOWED_CHANNELS='matrix,teams'"
        template: templates/deployment.yaml

  # --- Gap A: Discord channel-strip allowlist ---
  - it: should add discord to the channel-strip allowlist when discord enabled
    set:
      channels:
        discord:
          enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "ALLOWED_CHANNELS='matrix,discord'"
        template: templates/deployment.yaml

  - it: should NOT add discord to the channel-strip allowlist when disabled
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "discord"
        template: templates/deployment.yaml

  # --- Gap C: silent config-revert detection ---
  - it: should include revert detection (warn) by default, ordered before strip
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'OC_CHART=/config/openclaw.json'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'CONFIG REVERT DETECTED'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"event":"config_revert"'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'config\.onRevert=warn'
        template: templates/deployment.yaml
      # warn mode must NOT exit
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'to surface the revert'
        template: templates/deployment.yaml

  - it: should exit 1 on revert when config.onRevert=fail
    set:
      config:
        onRevert: fail
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'config\.onRevert=fail'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'to surface the revert'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '\n\s*exit 1\n'
        template: templates/deployment.yaml

  - it: should omit revert detection entirely when config.onRevert=ignore
    set:
      config:
        onRevert: ignore
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'CONFIG REVERT DETECTED'
        template: templates/deployment.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'OC_CHART='
        template: templates/deployment.yaml

  # --- Gap B: prune stale chart-managed skills ---
  - it: should omit skill prune block by default
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'chart-skills-manifest'
        template: templates/deployment.yaml

  - it: should include skill prune block when pruneStaleSkills=true
    set:
      pruneStaleSkills: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'SKILL_MANIFEST=/data/\.chart-skills-manifest'
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'pruned stale chart-managed skill'
        template: templates/deployment.yaml
