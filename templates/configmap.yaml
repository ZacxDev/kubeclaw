{{- /*
  rawConfig REPLACES the generated config; configOverlay MERGES onto it.
  Setting both is ambiguous, so fail the render rather than silently picking
  one (same fail-loud posture as the NetworkPolicy guards).
*/ -}}
{{- if and .Values.rawConfig .Values.configOverlay }}
{{- fail "kubeclaw: set either rawConfig (full replacement) or configOverlay (additive merge), not both. configOverlay is the composable option — prefer it unless you need to author openclaw.json from scratch." }}
{{- end }}
{{- /*
  The generated config lives in a named template so it can be consumed three
  ways below. Emitted as text (not a dict) because the overlay path parses it
  back with mustFromJson.

  mustFromJson, NOT fromJson: plain fromJson does not fail on malformed input,
  it returns {"Error": "<msg>"} and lets the render SUCCEED — silently
  replacing the entire generated config with an error map plus the overlay.
  That map is valid JSON, so the startup script's jq passes and the agent
  boots with no model, no workspace and no channels. mustFromJson aborts.

  Keep explanatory comments OUT of the `openclaw.json` literal block below.
  A whitespace-trimming Go-template comment in there eats the newlines that
  separate the block's lines and produces invalid YAML. (Note also that the
  comment delimiters cannot be written literally inside a comment - doing so
  terminates it early and corrupts the whole template.)
*/ -}}
{{- define "kubeclaw.configJson" }}
    {
      "agents": {
        "defaults": {
          "workspace": {{ include "kubeclaw.workspace" . | quote }},
          "model": {
            "primary": {{ .Values.agent.model.primary | quote }}
          },
          {{- if .Values.agent.thinkingDefault }}
          "thinkingDefault": {{ .Values.agent.thinkingDefault | quote }},
          {{- end }}
          "maxConcurrent": {{ .Values.agent.maxConcurrent }}
          {{- range $k, $v := .Values.agent.defaults }}
          ,{{ $k | quote }}: {{ $v | toJson }}
          {{- end }}
        },
        "list": [
          {
            "id": {{ include "kubeclaw.agentId" . | quote }},
            "name": {{ include "kubeclaw.displayName" . | quote }},
            "default": true,
            "workspace": {{ include "kubeclaw.workspace" . | quote }},
            "groupChat": {
              "mentionPatterns": {{ include "kubeclaw.mentionPatterns" . }}
            }
          }
        ]
      },
      "channels": {
        {{- if .Values.channels.matrix.enabled }}
        "matrix": {
          "enabled": {{ .Values.channels.matrix.enabled }},
          "homeserver": {{ .Values.channels.matrix.homeserver | quote }},
          {{- if .Values.channels.matrix.streamMode }}
          "streamMode": {{ .Values.channels.matrix.streamMode | quote }},
          {{- end }}
          "dm": {
            "policy": {{ .Values.channels.matrix.dm.policy | quote }},
            "allowFrom": {{ .Values.channels.matrix.dm.allowFrom | toJson }}
          },
          "groupPolicy": {{ .Values.channels.matrix.groupPolicy | quote }},
          "autoJoin": {{ .Values.channels.matrix.autoJoin | quote }},
          {{- if .Values.channels.matrix.typingIndicator }}
          "typingIndicator": {
            "enabled": {{ .Values.channels.matrix.typingIndicator.enabled }},
            "timeout": {{ .Values.channels.matrix.typingIndicator.timeout | default 30000 }}
          }
          {{- end }}
        },
        {{- end }}
        "telegram": {
          "enabled": {{ .Values.channels.telegram.enabled }}
        },
        {{- if and .Values.channels.discord .Values.channels.discord.enabled }}
        "discord": {
          "enabled": true,
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_BOT_TOKEN"
          },
          {{- if .Values.channels.discord.applicationId }}
          "applicationId": {{ .Values.channels.discord.applicationId | quote }},
          {{- end }}
          "dmPolicy": {{ .Values.channels.discord.dmPolicy | default "pairing" | quote }},
          "allowFrom": {{ .Values.channels.discord.allowFrom | default list | toJson }},
          "groupPolicy": {{ .Values.channels.discord.groupPolicy | default "allowlist" | quote }}
        },
        {{- end }}
        "whatsapp": {
          "dmPolicy": {{ .Values.channels.whatsapp.dmPolicy | quote }},
          "groupPolicy": {{ .Values.channels.whatsapp.groupPolicy | quote }},
          "sendReadReceipts": {{ .Values.channels.whatsapp.sendReadReceipts }}
          {{- if .Values.channels.whatsapp.allowFrom }},
          "allowFrom": {{ .Values.channels.whatsapp.allowFrom | toJson }}
          {{- end }}
        }
        {{- if and .Values.channels.teams .Values.channels.teams.enabled }},
        "teams": {
          "enabled": true,
          "appId": {{ .Values.channels.teams.appId | quote }},
          "tenantId": {{ .Values.channels.teams.tenantId | quote }}
        }
        {{- end }}
        {{- if .Values.channels.sms.enabled }},
        "sms": {
          "enabled": true,
          "provider": {{ .Values.channels.sms.provider | quote }},
          "phoneNumber": {{ .Values.channels.sms.phoneNumber | quote }}
        }
        {{- end }}
        {{- if .Values.channels.email.enabled }},
        "email": {
          "enabled": true,
          "dmPolicy": "open"
        }
        {{- end }}
      },
      "tools": {
        "web": {
          "search": {
            "enabled": {{ .Values.tools.web.search.enabled }},
            "provider": {{ .Values.tools.web.search.provider | quote }},
            "maxResults": {{ .Values.tools.web.search.maxResults }}
          }
        }
      },
      {{- if .Values.mcpServers.clankTask.enabled }}
      "mcp": {
        "servers": {
          "clank-task": {
            "command": "/usr/local/bin/clank-task-mcp",
            "args": []
          }
        }
      },
      {{- end }}
      {{- $updateCheck := ((.Values.config | default dict).updateCheckOnStart | default false) }}
      "update": {
        "checkOnStart": {{ $updateCheck }}
      },
      "gateway": {
        "mode": {{ .Values.gateway.mode | quote }},
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "http": {
          "endpoints": {
            "chatCompletions": {
              "enabled": {{ .Values.gateway.http.endpoints.chatCompletions.enabled }}
            },
            "responses": {
              "enabled": {{ .Values.gateway.http.endpoints.responses.enabled }}
            }
          }
        }
      },
      "commands": {
        "native": {{ .Values.commands.native | quote }},
        "nativeSkills": {{ .Values.commands.nativeSkills | quote }}
      },
      "messages": {
        "ackReactionScope": {{ .Values.messages.ackReactionScope | quote }},
        "groupChat": {
          "mentionPatterns": {{ include "kubeclaw.mentionPatterns" . }}
        }
      },
      "hooks": {
        "enabled": {{ .Values.hooks.enabled }},
        "allowedSessionKeyPrefixes": [
          {{- if .Values.hooks.allowedSessionKeyPrefixes }}
          {{- range $i, $p := .Values.hooks.allowedSessionKeyPrefixes }}
          {{- if $i }},{{ end }}
          {{ $p | quote }}
          {{- end }}
          {{- else }}
          "hook:"
          {{- end }}
        ],
        "mappings": [
          {{- if .Values.hooks.mappings }}
          {{- range $i, $m := .Values.hooks.mappings }}
          {{- if $i }},{{ end }}
          {{ $m | toJson }}
          {{- end }}
          {{- else }}
          {
            "match": { "path": "element" },
            "action": "agent",
            "wakeMode": "now",
            "name": {{ include "kubeclaw.displayName" . | quote }},
            "sessionKey": "hook:element:{{`{{timestamp}}`}}",
            "messageTemplate": {{ printf "{{instruction}}\n\n{{#if elementRef}}Element reference:\n```json\n{{{elementRef}}}\n```\n\n**Page URL:** {{pageUrl}}{{/if}}" | quote }},
            "deliver": false
          }
          {{- end }}
          {{- if .Values.channels.email.enabled }},
          {
            "match": { "path": "email" },
            "action": "agent",
            "wakeMode": "now",
            "sessionKey": "hook:email:{{`{{from}}`}}",
            "messageTemplate": "New email received:\nFrom: {{`{{from}}`}}\nSubject: {{`{{subject}}`}}\n\n{{`{{body}}`}}",
            "deliver": true
          }
          {{- end }}
        ]
      }
    }
{{- /*
  `-}}` here is load-bearing: it trims the newline this define would otherwise
  leave at the top of the rendered file. checksum/config hashes this template's
  full rendered output, so a stray leading newline changes the annotation and
  rolling-restarts every agent in the fleet on upgrade for a byte-identical
  ConfigMap. Verified by scripts/render-diff.py + a manifest byte-compare.
*/ -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-config
  namespace: {{ include "kubeclaw.namespace" . }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {{- if .Values.rawConfig }}
    {{ .Values.rawConfig | toJson | indent 4 }}
    {{- else if .Values.configOverlay }}
    {{ mergeOverwrite (include "kubeclaw.configJson" . | mustFromJson) .Values.configOverlay | toJson | indent 4 }}
    {{- else }}
    {{- include "kubeclaw.configJson" . }}
    {{- end }}
  repos.json: |
    {{ .Values.git.repos | toJson }}
