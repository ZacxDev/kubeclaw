suite: configmap
templates:
  - templates/configmap.yaml
set:
  agentName: testbot
  existingSecret: devpod-secrets
tests:
  - it: should create a ConfigMap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: testbot-config

  - it: should set correct namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: devpod-testbot

  - it: should use agentName as agent ID by default
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"id":\s*"testbot"'

  - it: should use custom agent ID when set
    set:
      agent:
        id: custom-id
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"id":\s*"custom-id"'

  - it: should use default workspace path
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: "/data/workspace"

  - it: should use first repo path as workspace
    set:
      git:
        repos:
          - url: "git@github.com:test/repo.git"
            path: "/data/repos/myrepo"
            branch: "main"
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: "/data/repos/myrepo"

  - it: should use rawConfig when set
    set:
      rawConfig:
        custom: true
        agents:
          list: []
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"custom"'
      # rawConfig REPLACES. Assert chart-generated keys are gone — matching
      # only on "custom" would pass even if the templated config leaked in.
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"maxConcurrent"'
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"mentionPatterns"'

  # --- configOverlay: additive merge onto the generated config ---

  - it: configOverlay adds a key without dropping its siblings
    set:
      configOverlay:
        agents:
          defaults:
            timeoutSeconds: 600
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"timeoutSeconds":600'
      # The whole point: chart-generated siblings survive the merge.
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"maxConcurrent":4'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"primary":"anthropic/claude-sonnet-4"'

  - it: configOverlay overrides a nested leaf and keeps the rest of the subtree
    set:
      configOverlay:
        gateway:
          mode: remote
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"mode":"remote"'
      # gateway.http.* is generated, not in the overlay, and must survive.
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"chatCompletions":\{"enabled":true\}'

  - it: configOverlay can override a value the chart itself generated
    set:
      agent:
        maxConcurrent: 4
      configOverlay:
        agents:
          defaults:
            maxConcurrent: 99
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"maxConcurrent":99'
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"maxConcurrent":4'

  # INVARIANT GUARD, not regression coverage: this passes on pre-change code
  # too. It pins the byte-identity that keeps checksum/config stable on
  # upgrade — if someone later routes the no-overlay case through the merge
  # path, the compact form would land here and this goes red.
  - it: empty configOverlay renders the generated config untouched
    set:
      configOverlay: {}
    asserts:
      # No overlay => the verbatim text path, so the pretty-printed (spaced)
      # form is emitted rather than the compact merged form.
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"maxConcurrent": 4'

  # Pins the `must` in mustFromJson. Plain fromJson does NOT fail on malformed
  # input — it returns {"Error": "<msg>"} and the render SUCCEEDS, silently
  # swapping the whole config for an error map. That map is valid JSON, so the
  # startup script's jq passes and the agent boots with no model/workspace/
  # channels. Revert to fromJson and this test goes red.
  #
  # The trigger is a real pre-existing defect in the JSON block: matrix enabled
  # with a null typingIndicator leaves a trailing comma after "autoJoin".
  - it: a malformed generated config fails the render on the overlay path
    set:
      channels:
        matrix:
          enabled: true
          typingIndicator: null
      configOverlay:
        anything: 1
    asserts:
      - failedTemplate:
          errorPattern: "mustFromJson"

  - it: setting both rawConfig and configOverlay fails the render
    set:
      rawConfig:
        custom: true
      configOverlay:
        agents:
          defaults:
            timeoutSeconds: 600
    asserts:
      - failedTemplate:
          errorMessage: "kubeclaw: set either rawConfig (full replacement) or configOverlay (additive merge), not both. configOverlay is the composable option — prefer it unless you need to author openclaw.json from scratch."

  - it: should generate repos.json
    set:
      git:
        repos:
          - url: "git@github.com:test/repo.git"
            path: "/data/repos/repo"
            branch: "main"
    asserts:
      - matchRegex:
          path: data["repos.json"]
          pattern: "git@github.com:test/repo.git"

  - it: should merge agent.defaults passthrough keys into openclaw.json
    set:
      agent:
        defaults:
          timeoutSeconds: 600
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"timeoutSeconds":\s*600'

  - it: should render channels.teams when enabled
    set:
      channels:
        teams:
          enabled: true
          appId: "app-123"
          tenantId: "tenant-456"
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"teams":\s*\{'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"appId":\s*"app-123"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"tenantId":\s*"tenant-456"'

  - it: should not render channels.teams when disabled
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"teams":\s*\{'

  - it: should render channels.discord when enabled
    set:
      channels:
        discord:
          enabled: true
          applicationId: "disc-app-123"
          dmPolicy: "allowlist"
          allowFrom:
            - "111222333"
          groupPolicy: "open"
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"discord":\s*\{'
      # token uses the env-source form (no jq injection)
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"id":\s*"DISCORD_BOT_TOKEN"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"source":\s*"env"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"applicationId":\s*"disc-app-123"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"dmPolicy":\s*"allowlist"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"groupPolicy":\s*"open"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"allowFrom":\s*\[\s*"111222333"\s*\]'

  - it: should render discord with defaults and omit applicationId when blank
    set:
      channels:
        discord:
          enabled: true
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"discord":\s*\{'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"dmPolicy":\s*"pairing"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"groupPolicy":\s*"allowlist"'
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"discord":\s*\{[^}]*"applicationId"'

  - it: should not render channels.discord when disabled
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"discord":\s*\{'

  - it: should render whatsapp.allowFrom when set
    set:
      channels:
        whatsapp:
          allowFrom:
            - "+15551234567"
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"allowFrom":\s*\[\s*"\+15551234567"\s*\]'

  - it: should not render whatsapp.allowFrom when empty
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"whatsapp":\s*\{[^}]*"allowFrom"'

  # --- openclaw config-schema validity regression (verified on 2026.7.1-2
  #     AND 2026.6.1, 2026-07-25) ---
  # The chart's rendered config must be valid on current openclaw.
  # The legacy top-level `mcpServers` key is rejected by BOTH 2026.7.x and
  # 2026.6.1 ("<root>: Invalid input"); MCP servers now live under the native
  # `mcp.servers.<name>` key. matrix streamMode/typingIndicator keys still
  # default OFF (see values.yaml).
  - it: should NOT emit the legacy mcpServers root key (rejected by 2026.6.1 + 2026.7.x)
    set:
      mcpServers:
        clankTask:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"mcpServers"'
  - it: should emit mcp.servers.clank-task when MCP enabled (native key)
    set:
      mcpServers:
        clankTask:
          enabled: true
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"mcp":\s*\{'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"servers":\s*\{'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"clank-task":\s*\{'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"command":\s*"/usr/local/bin/clank-task-mcp"'
      # transport is intentionally omitted (stdio inferred from command;
      # 2026.6.1's enum rejects an explicit "stdio")
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"transport"'
  - it: should NOT emit an mcp block when MCP disabled (default)
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"mcp":\s*\{'
  # --- doctor/gateway npm update-check toggle ---
  # update.checkOnStart:false stops the blocking registry.npmjs.org fetch that
  # hangs `openclaw doctor --fix` / gateway start under restricted egress on
  # openclaw >= 2026.6.11. Default OFF (safe for hardened agents).
  - it: should emit update.checkOnStart false by default
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"update":\s*\{\s*"checkOnStart":\s*false'
  - it: should emit update.checkOnStart true when opted in
    set:
      config:
        updateCheckOnStart: true
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"checkOnStart":\s*true'
  - it: should NOT emit a matrix channel block by default (2026.6.x schema)
    asserts:
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"streamMode"'
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"matrix"\s*:\s*\{'

  # --- tools.web.search: provider must not be emitted when search is OFF ---
  # Regression: openclaw validates tools.web.search.provider even when enabled
  # is false, so the values.yaml default of "brave" crash-looped every agent
  # that disabled search. Both devpods sat NotReady for ~4 days on this.
  - it: should NOT emit a search provider when web search is disabled
    set:
      tools:
        web:
          search:
            enabled: false
            provider: brave
            maxResults: 3
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"search":\s*\{\s*"enabled":\s*false\s*\}'
      - notMatchRegex:
          path: data["openclaw.json"]
          pattern: '"provider":\s*"brave"'

  - it: should still emit provider and maxResults when web search is enabled
    set:
      tools:
        web:
          search:
            enabled: true
            provider: brave
            maxResults: 5
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"provider":\s*"brave"'
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"maxResults":\s*5'

  - it: should emit valid JSON in both search states
    set:
      tools:
        web:
          search:
            enabled: false
    asserts:
      - matchRegex:
          path: data["openclaw.json"]
          pattern: '"tools":'
