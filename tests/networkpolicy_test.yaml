suite: egress NetworkPolicy (CiliumNetworkPolicy)
templates:
  - templates/networkpolicy.yaml
set:
  agentName: testbot
  existingSecret: devpod-secrets
tests:
  - it: renders NO networkpolicy by default (existing agents unaffected)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a valid CiliumNetworkPolicy when enabled
    set:
      networkPolicy:
        enabled: true
        egress:
          fqdns:
            - "openrouter.ai"
            - "*.githubusercontent.com"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: apiVersion
          value: cilium.io/v2
      - equal:
          path: metadata.name
          value: testbot-egress
      - equal:
          path: metadata.namespace
          value: devpod-testbot
      # egress-only: selects the agent pod
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/instance"]
          value: testbot
      # DNS visibility rule present so toFQDNs can resolve
      - equal:
          path: spec.egress[0].toPorts[0].rules.dns[0].matchPattern
          value: "*"
      # kube-apiserver entity allowed
      - contains:
          path: spec.egress[1].toEntities
          content: kube-apiserver

  - it: auto-classifies exact vs wildcard FQDNs (matchName / matchPattern)
    set:
      networkPolicy:
        enabled: true
        egress:
          fqdns:
            - "openrouter.ai"
            - "*.githubusercontent.com"
    asserts:
      # exact host -> matchName ; wildcard -> matchPattern (order preserved,
      # the toFQDNs rule is the last egress entry when no endpoints are set)
      - contains:
          path: spec.egress[2].toFQDNs
          content:
            matchName: "openrouter.ai"
      - contains:
          path: spec.egress[2].toFQDNs
          content:
            matchPattern: "*.githubusercontent.com"
      # default FQDN port is 443
      - equal:
          path: spec.egress[2].toPorts[0].ports[0].port
          value: "443"

  - it: renders in-cluster endpoint egress with k8s-prefixed labels
    set:
      networkPolicy:
        enabled: true
        egress:
          endpoints:
            - namespace: mailbox
              labels:
                app: mailbox-postgres
              ports:
                - port: "5432"
                  protocol: TCP
    asserts:
      # endpoint rule is egress[2] (after dns + apiserver)
      - equal:
          path: spec.egress[2].toEndpoints[0].matchLabels["k8s:io.kubernetes.pod.namespace"]
          value: mailbox
      - equal:
          path: spec.egress[2].toEndpoints[0].matchLabels["k8s:app"]
          value: mailbox-postgres
      - equal:
          path: spec.egress[2].toPorts[0].ports[0].port
          value: "5432"

  - it: omits kube-apiserver when allowKubeApiserver=false
    set:
      networkPolicy:
        enabled: true
        egress:
          allowKubeApiserver: false
          fqdns:
            - "openrouter.ai"
    asserts:
      # only dns (egress[0]) + fqdns (egress[1]) remain
      - notExists:
          path: spec.egress[2]

  - it: fails the render when enabled without cilium
    set:
      networkPolicy:
        enabled: true
        cilium: false
    asserts:
      - failedTemplate:
          errorMessage: "networkPolicy.enabled requires networkPolicy.cilium=true: the egress allowlist uses FQDN rules (toFQDNs) which a plain networking.k8s.io NetworkPolicy cannot express. Homelab CNI is Cilium. Either keep networkPolicy.cilium=true, or hand-author a plain NetworkPolicy outside the chart for a non-Cilium cluster."
