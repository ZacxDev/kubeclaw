apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeclaw.fullname" . }}-devpod
  namespace: {{ include "kubeclaw.namespace" . }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeclaw.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.channels.email.enabled }}
        checksum/email-plugin: {{ include (print $.Template.BasePath "/configmap-email-plugin.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.skills }}
        checksum/skills: {{ include (print $.Template.BasePath "/configmap-skills.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.workspaceFiles }}
        checksum/workspace: {{ include (print $.Template.BasePath "/configmap-workspace.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.workspaceContent }}
        checksum/workspace-content: {{ include (print $.Template.BasePath "/configmap-workspace-content.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "kubeclaw.fullname" . }}-devpod
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.snapshots.enabled .Values.snapshots.save.onShutdown }}
      terminationGracePeriodSeconds: {{ .Values.snapshots.save.terminationGracePeriodSeconds | default 300 }}
      {{- end }}
      hostname: {{ .Values.agentName | default (include "kubeclaw.fullname" .) | trunc 52 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # --- SSH setup ---
              mkdir -p /root/.ssh
              if [ -f /etc/git-secret/ssh ]; then
                cp /etc/git-secret/ssh /root/.ssh/id_rsa
                chmod 600 /root/.ssh/id_rsa
                echo "Host github.com
                HostName github.com
                User git
                IdentityFile /root/.ssh/id_rsa
                StrictHostKeyChecking no" > /root/.ssh/config
                chmod 600 /root/.ssh/config
              fi

              # --- Repo clone/pull ---
              mkdir -p /data/workspace
              if [ -f /config/repos.json ]; then
                for repo in $(jq -r '.[] | @base64' /config/repos.json); do
                  _jq() { echo "$repo" | base64 -d | jq -r "$1"; }
                  REPO_URL=$(_jq '.url')
                  REPO_PATH=$(_jq '.path')
                  REPO_BRANCH=$(_jq '.branch // "main"')

                  if [ -d "$REPO_PATH/.git" ]; then
                    echo "Pulling $REPO_PATH..."
                    cd "$REPO_PATH" && git pull origin "$REPO_BRANCH" || true
                  else
                    echo "Cloning $REPO_URL to $REPO_PATH..."
                    rm -rf "$REPO_PATH"
                    git clone -b "$REPO_BRANCH" "$REPO_URL" "$REPO_PATH"
                  fi

                  cd "$REPO_PATH"
                  git config user.email "${GIT_EMAIL}"
                  git config user.name "${GIT_NAME}"
                done
              fi

              {{- if .Values.git.autoPull.enabled }}
              # --- Background git auto-pull loop ---
              # Keeps workspace repos in sync with their remote branches without
              # requiring /git pull from Matrix or a pod restart. Fixes the
              # "committed upstream but devpod is stale" operational gap.
              #
              # Safety:
              #   - Dirty-skip: if the working tree has uncommitted changes OR
              #     untracked files (agent WIP), skip the pull entirely.
              #     Never rebase over active work.
              #   - Fetch-then-compare: only pull when origin has actually
              #     advanced. Zero log noise on the common no-change path.
              #   - Rebase + autostash on pull (belt-and-suspenders given
              #     the dirty-skip gate already filters WIP).
              #   - Per-repo failure isolation — one repo's fetch failure
              #     does not abort the loop for others.
              if [ -f /config/repos.json ]; then
                (
                  # --- set -e is INHERITED from the init script and will kill
                  #     this subshell on any non-zero exit (e.g. a `[ ... ] &&`
                  #     expression whose final test is false, which happens on
                  #     every successful pull path). Disable it locally so the
                  #     loop survives long-running operation.
                  set +e

                  # --- Log to a file inside the pod. Backgrounded subshells
                  #     spawned during container init inherit an orphaned pipe
                  #     for stdout/stderr that is NOT the container log stream,
                  #     so `echo` from here is invisible to `kubectl logs`.
                  #     Operators can tail /tmp/git-sync.log via
                  #       kubectl exec <pod> -- tail -f /tmp/git-sync.log
                  #     to observe loop behavior. This is a pre-existing quirk
                  #     of the init script's subshell model (the workspace-sync
                  #     loop has the same limitation).
                  LOG_FILE=/tmp/git-sync.log
                  touch "$LOG_FILE" 2>/dev/null || LOG_FILE=/dev/null
                  exec >>"$LOG_FILE" 2>&1

                  GIT_SYNC_INTERVAL={{ .Values.git.autoPull.intervalSeconds | default 300 }}
                  echo "[$(date -Iseconds)] git-sync: loop entered (interval: ${GIT_SYNC_INTERVAL}s, log: ${LOG_FILE})"
                  sleep 60  # initial delay — let gateway start, avoid thundering-herd
                  while true; do
                    sleep "$GIT_SYNC_INTERVAL"
                    for repo in $(jq -r '.[] | @base64' /config/repos.json 2>/dev/null); do
                      _jq() { echo "$repo" | base64 -d | jq -r "$1"; }
                      REPO_PATH=$(_jq '.path')
                      REPO_BRANCH=$(_jq '.branch // "main"')
                      if [ ! -d "$REPO_PATH/.git" ]; then continue; fi
                      if ! cd "$REPO_PATH" 2>/dev/null; then continue; fi

                      # Dirty-skip: any modifications to TRACKED files → skip.
                      # Uses `git diff HEAD` instead of `git status --porcelain`
                      # because devpod workspaces always have untracked runtime
                      # files (.openclaw/, AGENTS.md, HEARTBEAT.md, etc.) that
                      # are never committed. Untracked files don't interfere
                      # with `git pull --rebase` which only touches tracked content.
                      if ! git diff --quiet HEAD 2>/dev/null; then
                        continue
                      fi

                      # Fetch first; on failure log and skip this repo
                      if ! git fetch --quiet origin "$REPO_BRANCH" 2>/dev/null; then
                        echo "[$(date -Iseconds)] git-sync: fetch failed for $REPO_PATH"
                        continue
                      fi

                      LOCAL=$(git rev-parse HEAD 2>/dev/null)
                      REMOTE=$(git rev-parse "origin/$REPO_BRANCH" 2>/dev/null)
                      if [ -z "$LOCAL" ] || [ -z "$REMOTE" ]; then continue; fi
                      if [ "$LOCAL" = "$REMOTE" ]; then continue; fi

                      if git pull --rebase --autostash --quiet origin "$REPO_BRANCH" 2>/dev/null; then
                        echo "[$(date -Iseconds)] git-sync: pulled $REPO_PATH ($LOCAL -> $REMOTE)"
                      else
                        echo "[$(date -Iseconds)] git-sync: pull failed for $REPO_PATH (conflict?)"
                      fi
                    done
                  done
                ) &
                echo "[$(date -Iseconds)] Git auto-pull started (interval: {{ .Values.git.autoPull.intervalSeconds | default 300 }}s, log file: /tmp/git-sync.log)"
              fi
              {{- end }}

              # --- Persist ~/.openclaw on the PVC so sessions, cron state,
              #     and credentials survive pod restarts ---
              # /root/.openclaw is now provided by the data PVC mounted at
              # subPath: openclaw (see volumeMounts). Just ensure it exists.
              mkdir -p /root/.openclaw

              # --- Email plugin ---
              {{- if .Values.channels.email.enabled }}
              if [ -d /config/email-plugin ]; then
                PLUGIN_DIR="/usr/local/lib/node_modules/openclaw/extensions/email"
                mkdir -p "$PLUGIN_DIR"
                cp /config/email-plugin/index.js "$PLUGIN_DIR/"
                cp /config/email-plugin/package.json "$PLUGIN_DIR/"
                cp /config/email-plugin/openclaw.plugin.json "$PLUGIN_DIR/"
                echo "Email plugin installed"
              fi
              {{- end }}

              # --- OAuth credentials ---
              mkdir -p /data/.claude
              if [ ! -f /data/.claude/.credentials.json ] && [ -f /secrets/claude-credentials.json ]; then
                cp /secrets/claude-credentials.json /data/.claude/.credentials.json
                chmod 600 /data/.claude/.credentials.json
              fi
              ln -sf /data/.claude /root/.claude

              {{- if .Values.infraTools.enabled }}
              # --- Infrastructure tools ---
              echo "Installing kubectl..."
              curl -fsSL "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl" -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl

              echo "Installing flux..."
              curl -fsSL https://fluxcd.io/install.sh | bash

              echo "Installing sops..."
              curl -fsSL "https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.$(dpkg --print-architecture)" -o /usr/local/bin/sops
              chmod +x /usr/local/bin/sops

              echo "Installing age..."
              ARCH=$(dpkg --print-architecture)
              curl -fsSL "https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-${ARCH}.tar.gz" | tar xz -C /tmp
              mv /tmp/age/age /usr/local/bin/
              mv /tmp/age/age-keygen /usr/local/bin/
              rm -rf /tmp/age

              # Setup in-cluster kubeconfig
              mkdir -p /root/.kube
              if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
                echo "Setting up in-cluster kubeconfig..."
                kubectl config set-cluster in-cluster --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                kubectl config set-credentials devpod --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                kubectl config set-context in-cluster --cluster=in-cluster --user=devpod --namespace={{ include "kubeclaw.namespace" . }}
                kubectl config use-context in-cluster
              fi

              # Copy remote kubeconfigs
              if [ -d /etc/kubeconfigs ]; then
                for kc in /etc/kubeconfigs/*; do
                  [ -f "$kc" ] || continue
                  cp "$kc" "/root/.kube/$(basename $kc)"
                  chmod 600 "/root/.kube/$(basename $kc)"
                done
              fi

              echo "Verifying infrastructure tools..."
              kubectl version --client 2>/dev/null || true
              flux --version 2>/dev/null || true
              sops --version 2>/dev/null || true
              {{- end }}

              {{- if .Values.snapshots.enabled }}
              # --- Snapshot tools (rclone) ---
              if ! command -v rclone >/dev/null 2>&1; then
                echo "Installing rclone..."
                curl -fsSL "https://downloads.rclone.org/rclone-current-linux-$(dpkg --print-architecture).deb" -o /tmp/rclone.deb
                dpkg -i /tmp/rclone.deb
                rm -f /tmp/rclone.deb
              fi

              {{- $providers := dict "s3" "AWS" "minio" "Minio" "r2" "Cloudflare" }}
              {{- $rcloneProvider := index $providers (.Values.snapshots.provider | default "s3") | default "AWS" }}
              {{- $snapshotPrefix := .Values.snapshots.prefix | default .Values.agentName }}
              {{- $snapshotBucket := .Values.snapshots.bucket }}
              {{- $snapshotRemote := printf "snapshot:%s/%s" $snapshotBucket $snapshotPrefix }}
              {{- if .Values.snapshots.encryption.enabled }}
              {{- $snapshotRemote = "encrypted:" }}
              {{- end }}

              # Generate rclone config
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf << 'RCLONECONF'
              [snapshot]
              type = s3
              provider = {{ $rcloneProvider }}
              {{- if .Values.snapshots.endpoint }}
              {{- $ep := .Values.snapshots.endpoint }}
              {{- if and (not (hasPrefix "http://" $ep)) (not (hasPrefix "https://" $ep)) }}
              {{- $ep = printf "http://%s" $ep }}
              {{- end }}
              endpoint = {{ $ep }}
              {{- end }}
              region = {{ .Values.snapshots.region | default "us-east-1" }}
              env_auth = true
              {{- if .Values.snapshots.encryption.enabled }}

              [encrypted]
              type = crypt
              remote = snapshot:{{ $snapshotBucket }}/{{ $snapshotPrefix }}
              password = ENCRYPTION_PASSWORD_PLACEHOLDER
              {{- end }}
              RCLONECONF

              {{- if .Values.snapshots.encryption.enabled }}
              OBSCURED_PASS=$(rclone obscure "$SNAPSHOT_ENCRYPTION_PASSWORD")
              sed -i "s|ENCRYPTION_PASSWORD_PLACEHOLDER|${OBSCURED_PASS}|" /root/.config/rclone/rclone.conf
              {{- end }}

              # Generate snapshot-save script
              cat > /usr/local/bin/snapshot-save << 'SAVESCRIPT'
              #!/bin/sh
              set -e
              BWLIMIT="${1:-0}"
              TIMESTAMP=$(date +%Y%m%dT%H%M%S)
              REMOTE="{{ $snapshotRemote }}"
              echo "[$(date -Iseconds)] Starting snapshot: $TIMESTAMP"
              {{- range .Values.snapshots.paths }}
              if [ -d "{{ . }}" ]; then
                echo "Syncing {{ . }}..."
                EXCLUDE_FROM_ARGS=""
                {{- if $.Values.snapshots.excludeFrom }}
                if [ -f "{{ $.Values.snapshots.excludeFrom }}" ]; then
                  EXCLUDE_FROM_ARGS="--exclude-from={{ $.Values.snapshots.excludeFrom }}"
                fi
                {{- else }}
                if [ -f "{{ . }}/.snapshotignore" ]; then
                  EXCLUDE_FROM_ARGS="--exclude-from={{ . }}/.snapshotignore"
                fi
                {{- end }}
                rclone sync "{{ . }}/" "${REMOTE}/${TIMESTAMP}/{{ base . }}/" \
                  {{- range $.Values.snapshots.exclude }}
                  --exclude="{{ . }}" \
                  {{- end }}
                  $EXCLUDE_FROM_ARGS \
                  --bwlimit="$BWLIMIT" --transfers=4 --checkers=4 --s3-no-check-bucket
              fi
              {{- end }}
              MAX_COUNT={{ .Values.snapshots.retention.maxCount | default 5 }}
              SNAPSHOTS=$(rclone lsjson "${REMOTE}/" --dirs-only 2>/dev/null | jq -r 'sort_by(.Name) | .[].Name' || true)
              COUNT=$(echo "$SNAPSHOTS" | grep -c . 2>/dev/null || echo "0")
              if [ "$COUNT" -gt "$MAX_COUNT" ]; then
                DELETE_COUNT=$((COUNT - MAX_COUNT))
                echo "[$(date -Iseconds)] Removing $DELETE_COUNT old snapshot(s)..."
                echo "$SNAPSHOTS" | head -n "$DELETE_COUNT" | while read -r snap; do
                  [ -n "$snap" ] && rclone purge "${REMOTE}/${snap}/" --s3-no-check-bucket && echo "Deleted: $snap"
                done
              fi
              echo "[$(date -Iseconds)] Snapshot complete: $TIMESTAMP"
              SAVESCRIPT
              chmod +x /usr/local/bin/snapshot-save

              {{- if .Values.snapshots.restore.onStartup }}
              # --- Snapshot restore ---
              SNAP_MARKER="/data/.snapshot-restored"
              if [ ! -f "$SNAP_MARKER" ]; then
                LATEST=$(rclone lsjson "{{ $snapshotRemote }}/" --dirs-only 2>/dev/null | jq -r 'sort_by(.Name) | last | .Name // empty' || true)
                if [ -n "$LATEST" ]; then
                  echo "[$(date -Iseconds)] Restoring workspace from snapshot: $LATEST"
                  {{- range .Values.snapshots.paths }}
                  mkdir -p "{{ . }}"
                  EXCLUDE_FROM_ARGS=""
                  {{- if $.Values.snapshots.excludeFrom }}
                  if [ -f "{{ $.Values.snapshots.excludeFrom }}" ]; then
                    EXCLUDE_FROM_ARGS="--exclude-from={{ $.Values.snapshots.excludeFrom }}"
                  fi
                  {{- end }}
                  rclone sync "{{ $snapshotRemote }}/${LATEST}/{{ base . }}/" "{{ . }}/" \
                    {{- range $.Values.snapshots.exclude }}
                    --exclude="{{ . }}" \
                    {{- end }}
                    $EXCLUDE_FROM_ARGS \
                    --transfers=4 --checkers=4 --s3-no-check-bucket
                  {{- end }}
                  echo "$LATEST" > "$SNAP_MARKER"
                  echo "[$(date -Iseconds)] Snapshot restored: $LATEST"
                else
                  echo "[$(date -Iseconds)] No snapshots found, starting fresh"
                fi
              else
                echo "[$(date -Iseconds)] Snapshot already restored ($(cat $SNAP_MARKER)), skipping"
              fi
              {{- end }}
              {{- end }}

              # --- Skills ---
              # Runs AFTER snapshot restore so current ConfigMap skills are authoritative.
              # rclone sync during restore would otherwise delete any skill not in the snapshot.
              mkdir -p /root/.openclaw/skills /root/.openclaw/cron
              CURRENT_SKILLS=""
              if [ -d /config/skills ]; then
                for f in /config/skills/*.md; do
                  [ -f "$f" ] || continue
                  skill_name=$(basename "$f" .md)
                  mkdir -p "/root/.openclaw/skills/${skill_name}"
                  cp "$f" "/root/.openclaw/skills/${skill_name}/SKILL.md"
                  CURRENT_SKILLS="${CURRENT_SKILLS}${skill_name}
              "
                done
              fi
              {{- if .Values.pruneStaleSkills }}
              # --- Prune chart-managed skills removed from values ---
              # SAFE manifest model: we only ever delete a skill dir that
              #   (a) is recorded in the PREVIOUS chart-managed manifest, AND
              #   (b) is NOT in the current set from /config/skills, AND
              #   (c) actually exists with a SKILL.md.
              # This guarantees unmanaged / snapshot-restored / agent-authored
              # skills are NEVER touched (they were never in our manifest).
              #
              # The manifest lives OUTSIDE the skills tree (and is on the data
              # PVC at /data, not the snapshot paths) so snapshot restore of
              # the skills dir cannot clobber it. First boot: manifest is empty
              # → nothing pruned, then we write the current set as the manifest.
              SKILL_MANIFEST=/data/.chart-skills-manifest
              if [ -f "$SKILL_MANIFEST" ]; then
                while IFS= read -r prev; do
                  [ -n "$prev" ] || continue
                  # Still in the current desired set? keep it.
                  if printf '%s\n' "$CURRENT_SKILLS" | grep -qxF "$prev"; then
                    continue
                  fi
                  # Only remove if it exists AND has a SKILL.md (i.e. looks
                  # like a chart-installed skill, not a random dir).
                  if [ -f "/root/.openclaw/skills/${prev}/SKILL.md" ]; then
                    rm -rf "/root/.openclaw/skills/${prev}"
                    echo "[$(date -Iseconds)] pruned stale chart-managed skill: ${prev}"
                  fi
                done < "$SKILL_MANIFEST"
              fi
              # Rewrite the manifest to the current chart-managed set (sorted,
              # de-duped, no blank lines). Next boot uses this as the baseline.
              printf '%s' "$CURRENT_SKILLS" | grep -v '^[[:space:]]*$' | sort -u > "$SKILL_MANIFEST" 2>/dev/null || true
              {{- end }}

              # --- Workspace files ---
              # Runs AFTER snapshot restore for same reason as Skills.
              if [ -f /config/workspace/files.json ]; then
                WORKSPACE="{{ include "kubeclaw.workspace" . }}"
                mkdir -p "$WORKSPACE"
                jq -c '.[]' /config/workspace/files.json | while read -r entry; do
                  fpath=$(echo "$entry" | jq -r '.path')
                  furl=$(echo "$entry" | jq -r '.url')
                  mkdir -p "$WORKSPACE/$(dirname "$fpath")"
                  curl -fsSL "$furl" -o "$WORKSPACE/$fpath"
                done
                echo "Workspace files installed: $(jq 'length' /config/workspace/files.json) files"
              fi

              # --- Workspace content (inline) ---
              # Runs AFTER snapshot restore for same reason as Skills.
              if [ -d /config/workspace-content ]; then
                WORKSPACE="{{ include "kubeclaw.workspace" . }}"
                mkdir -p "$WORKSPACE"
                for f in /config/workspace-content/*; do
                  [ -f "$f" ] || continue
                  fname=$(basename "$f")
                  cp "$f" "$WORKSPACE/$fname"
                done
                echo "Workspace content files installed"
              fi

              # --- Persist WhatsApp Baileys credentials across restarts ---
              {{- if .Values.channels.whatsapp.enabled }}
              mkdir -p /data/whatsapp-creds /root/.openclaw/credentials
              ln -sfn /data/whatsapp-creds /root/.openclaw/credentials/whatsapp
              {{- end }}

              # --- Generate openclaw.json with secrets injected ---
              # Gateway v2026.3+ requires hooks.token != gateway.auth.token.
              # Derive a distinct gateway token from HOOKS_TOKEN.
              GATEWAY_TOKEN=$(echo -n "gw-${HOOKS_TOKEN}" | sha256sum | cut -d' ' -f1)
              cat /config/openclaw.json | jq \
                --arg matrix_token "$MATRIX_ACCESS_TOKEN" \
                --arg telegram_token "$TELEGRAM_BOT_TOKEN" \
                --arg hooks_token "$HOOKS_TOKEN" \
                --arg gateway_token "$GATEWAY_TOKEN" \
                {{- if .Values.channels.sms.enabled }}
                --arg twilio_sid "$TWILIO_ACCOUNT_SID" \
                --arg twilio_token "$TWILIO_AUTH_TOKEN" \
                --arg twilio_phone "$TWILIO_PHONE_NUMBER" \
                {{- end }}
                '.channels.matrix.accessToken = $matrix_token |
                 .channels.telegram.botToken = $telegram_token |
                 {{- if .Values.channels.sms.enabled }}
                 .channels.sms.accountSid = $twilio_sid |
                 .channels.sms.authToken = $twilio_token |
                 .channels.sms.phoneNumber = $twilio_phone |
                 {{- end }}
                 .hooks.token = $hooks_token |
                 .gateway.auth.token = $gateway_token' \
                > /root/.openclaw/openclaw.json
              chmod 600 /root/.openclaw/openclaw.json

              # --- Pre-approve Telegram users ---
              {{- if and .Values.channels.telegram.enabled .Values.channels.telegram.allowFrom }}
              mkdir -p /root/.openclaw/credentials
              printf '%s\n' '{{ dict "version" 1 "allowFrom" .Values.channels.telegram.allowFrom | toJson }}' > /root/.openclaw/credentials/telegram-allowFrom.json
              chmod 600 /root/.openclaw/credentials/telegram-allowFrom.json
              echo "[$(date -Iseconds)] Pre-approved Telegram users: {{ .Values.channels.telegram.allowFrom | toJson }}"
              {{- end }}

              # --- Initialize channels ---
              {{- $onRevert := ((.Values.config | default dict).onRevert | default "warn") }}
              echo "[$(date -Iseconds)] Running openclaw doctor --fix..."
              openclaw doctor --fix || echo "Doctor exited with $?, continuing..."

              {{- if ne $onRevert "ignore" }}
              # --- Detect silent config revert (config.onRevert={{ $onRevert }}) ---
              # openclaw doctor --fix silently reverts openclaw.json to its
              # last-known-good copy when the generated config is rejected as
              # schema-invalid: the bad change looks applied while the agent
              # actually runs the OLD config. We CANNOT detect this by hashing
              # the file — doctor legitimately mutates a VALID config too (it
              # injects meta + a plugins/skills registry), so the file always
              # changes. Instead we check that the chart's OWN intended settings
              # survived: every scalar the chart writes to /config/openclaw.json
              # must still be present unchanged in the active config. A revert
              # restores an older config whose values differ, so a mismatch ==
              # the chart config did not take effect. Runs BEFORE the channel
              # strip (the strip only rewrites .channels, not these paths).
              OC_CONFIG=/root/.openclaw/openclaw.json
              OC_CHART=/config/openclaw.json
              _oc_field() { jq -r "$2 // \"\"" "$1" 2>/dev/null; }
              OC_REVERT=""
              for _p in '.agents.defaults.model.primary' '.agents.defaults.workspace' '.agents.list[0].id' '.agents.defaults.maxConcurrent'; do
                _want=$(_oc_field "$OC_CHART" "$_p")
                _got=$(_oc_field "$OC_CONFIG" "$_p")
                if [ "$_want" != "$_got" ]; then OC_REVERT="${_p} (want=${_want} got=${_got})"; break; fi
              done
              if [ -n "$OC_REVERT" ]; then
                # Structured one-line JSON event (mirrors stability-bundle tailer
                # style) so log collectors can alert on event=config_revert.
                printf '{"event":"config_revert","mode":"%s","mismatch":"%s","config":"%s","detail":"openclaw doctor did not apply the chart-generated config (likely reverted to openclaw.json.last-good after rejecting it as schema-invalid)"}\n' \
                  "{{ $onRevert }}" "$OC_REVERT" "$OC_CONFIG"
                echo "############################################################" >&2
                echo "# CONFIG REVERT DETECTED" >&2
                echo "# openclaw doctor --fix did not apply the chart-generated" >&2
                echo "# config — a setting this release rendered is missing from" >&2
                echo "# the active config (doctor likely rejected it and restored" >&2
                echo "# openclaw.json.last-good). The agent is NOT running the" >&2
                echo "# values from this chart release." >&2
                echo "# mismatch: $OC_REVERT" >&2
                echo "# Inspect: openclaw config validate; check .rejected.*/.clobbered.* files" >&2
                echo "############################################################" >&2
                # Sentinel file for out-of-band detection (kubectl exec / probes).
                printf '{"reverted":true,"mode":"%s","mismatch":"%s","ts":"%s"}\n' \
                  "{{ $onRevert }}" "$OC_REVERT" "$(date -Iseconds)" \
                  > /root/.openclaw/.config-reverted 2>/dev/null || true
                {{- if eq $onRevert "fail" }}
                echo "[$(date -Iseconds)] config.onRevert=fail — exiting 1 to surface the revert (CrashLoopBackOff)." >&2
                exit 1
                {{- end }}
              else
                # No revert: clear any stale sentinel from a prior boot.
                rm -f /root/.openclaw/.config-reverted 2>/dev/null || true
              fi
              {{- end }}

              # --- Strip channels not explicitly enabled in helm values ---
              # openclaw doctor may auto-enable channels (e.g. sms) that the
              # gateway version doesn't support. Remove any not in the configmap.
              {{- $enabledChannels := list }}
              {{- if .Values.channels.matrix.enabled }}{{ $enabledChannels = append $enabledChannels "matrix" }}{{ end }}
              {{- if .Values.channels.telegram.enabled }}{{ $enabledChannels = append $enabledChannels "telegram" }}{{ end }}
              {{- if (.Values.channels.discord | default dict).enabled }}{{ $enabledChannels = append $enabledChannels "discord" }}{{ end }}
              {{- if .Values.channels.whatsapp.enabled }}{{ $enabledChannels = append $enabledChannels "whatsapp" }}{{ end }}
              {{- if .Values.channels.email.enabled }}{{ $enabledChannels = append $enabledChannels "email" }}{{ end }}
              {{- if .Values.channels.sms.enabled }}{{ $enabledChannels = append $enabledChannels "sms" }}{{ end }}
              {{- if (.Values.channels.teams | default dict).enabled }}{{ $enabledChannels = append $enabledChannels "teams" }}{{ end }}
              ALLOWED_CHANNELS='{{ join "," $enabledChannels }}'
              if [ -f /root/.openclaw/openclaw.json ]; then
                jq --arg allowed "$ALLOWED_CHANNELS" '
                  ($allowed | split(",")) as $keep |
                  .channels |= with_entries(select(.key | IN($keep[])))
                ' /root/.openclaw/openclaw.json > /tmp/oc-clean.json \
                  && mv /tmp/oc-clean.json /root/.openclaw/openclaw.json \
                  && echo "[$(date -Iseconds)] Stripped unauthorized channels from openclaw.json"
              fi

              {{- $auth := (.Values.agent.auth | default dict) }}
              {{- $authProvider := ($auth.provider | default "anthropic-oauth") }}
              {{- if eq $authProvider "anthropic-oauth" }}
              # --- Bootstrap agent auth from Claude credentials ---
              AGENT_ID="{{ include "kubeclaw.agentId" . }}"
              AGENT_AUTH_DIR="/root/.openclaw/agents/$AGENT_ID/agent"
              CREDS_FILE="/root/.claude/.credentials.json"
              if [ -f "$CREDS_FILE" ]; then
                OAUTH_TOKEN=$(jq -r '.claudeAiOauth.accessToken // empty' "$CREDS_FILE" 2>/dev/null)
                if [ -n "$OAUTH_TOKEN" ]; then
                  REFRESH_TOKEN=$(jq -r '.claudeAiOauth.refreshToken // empty' "$CREDS_FILE" 2>/dev/null)
                  EXPIRES_AT=$(jq -r '.claudeAiOauth.expiresAt // 0' "$CREDS_FILE" 2>/dev/null)
                  mkdir -p "$AGENT_AUTH_DIR"
                  jq -n \
                    --arg access "$OAUTH_TOKEN" \
                    --arg refresh "$REFRESH_TOKEN" \
                    --argjson expires "$EXPIRES_AT" \
                    '{"version":1,"profiles":{"anthropic:claude-cli":{"type":"oauth","provider":"anthropic","access":$access,"refresh":$refresh,"expires":$expires}}}' \
                    > "$AGENT_AUTH_DIR/auth-profiles.json"
                  chmod 600 "$AGENT_AUTH_DIR/auth-profiles.json"
                  echo "[$(date -Iseconds)] Created auth-profiles for agent '$AGENT_ID' from Claude credentials"
                  mkdir -p /root/.openclaw/agents/main/agent
                  cp "$AGENT_AUTH_DIR/auth-profiles.json" /root/.openclaw/agents/main/agent/auth-profiles.json
                fi
              fi
              {{- else }}
              {{- $providerName := ($auth.providerName | default (ternary "openrouter" "" (eq $authProvider "openrouter"))) }}
              {{- $apiKeyEnv := ($auth.apiKeyEnv | default (ternary "OPENROUTER_API_KEY" "API_KEY" (eq $authProvider "openrouter"))) }}
              {{- $profileId := ($auth.profileId | default (printf "%s:default" $providerName)) }}
              # --- Bootstrap agent auth from API key ({{ $providerName }}) ---
              AGENT_ID="{{ include "kubeclaw.agentId" . }}"
              AGENT_AUTH_DIR="/root/.openclaw/agents/$AGENT_ID/agent"
              API_KEY_VAL="$(printenv {{ $apiKeyEnv | quote }} 2>/dev/null)"
              if [ -n "$API_KEY_VAL" ]; then
                mkdir -p "$AGENT_AUTH_DIR" /root/.openclaw/agents/main/agent
                jq -n --arg key "$API_KEY_VAL" \
                  '{"version":1,"profiles":{ {{ $profileId | quote }} :{"type":"api_key","provider":{{ $providerName | quote }},"key":$key}}}' \
                  > "$AGENT_AUTH_DIR/auth-profiles.json"
                chmod 600 "$AGENT_AUTH_DIR/auth-profiles.json"
                cp "$AGENT_AUTH_DIR/auth-profiles.json" /root/.openclaw/agents/main/agent/auth-profiles.json
                echo "[$(date -Iseconds)] Created {{ $providerName }} api_key auth-profiles for agent '$AGENT_ID'"
              else
                echo "[$(date -Iseconds)] WARNING: {{ $apiKeyEnv }} not set; skipping api_key auth bootstrap"
              fi
              {{- end }}

              {{- if .Values.extraInitCommands }}
              # --- Extra init commands ---
              {{ .Values.extraInitCommands | nindent 14 }}
              {{- end }}

              # --- Workspace sync (2-way, background) ---
              # Syncs /data/workspace ↔ portal S3 via the workspace API.
              #
              # On startup: pulls files from S3 that aren't on disk yet.
              # Every 15s: uploads changed files (find -newer), skips binary.
              # Every ~2.5min: reconciles deletions (local deletes → S3 deletes).
              #
              # X-Sync-Source: workspace-sync header prevents the portal from
              # writing files back to the pod (which would cause an mtime loop).
              if [ -n "$PORTAL_URL" ] && [ -n "$HOOKS_TOKEN" ]; then
                # --- Initial pull: restore workspace from S3 ---
                WORKSPACE="{{ include "kubeclaw.workspace" . }}"
                _ws_filelist=$(curl -sf \
                  -H "Authorization: Bearer $HOOKS_TOKEN" \
                  "$PORTAL_URL/api/internal/workspace" 2>/dev/null || true)
                if [ -n "$_ws_filelist" ] && echo "$_ws_filelist" | jq -e '.files' >/dev/null 2>&1; then
                  echo "$_ws_filelist" | jq -c '.files[]' | while read -r _entry; do
                    _fpath=$(echo "$_entry" | jq -r '.filename')
                    _fid=$(echo "$_entry" | jq -r '.id')
                    if [ ! -f "$WORKSPACE/$_fpath" ]; then
                      mkdir -p "$WORKSPACE/$(dirname "$_fpath")"
                      curl -sf \
                        -H "Authorization: Bearer $HOOKS_TOKEN" \
                        "$PORTAL_URL/api/internal/workspace/$_fid" \
                        -o "$WORKSPACE/$_fpath" 2>/dev/null \
                        && echo "[$(date -Iseconds)] workspace-sync: restored $_fpath" \
                        || echo "[$(date -Iseconds)] workspace-sync: failed to restore $_fpath" >&2
                    fi
                  done
                fi

                # --- Background sync loop ---
                (
                  MARKER="/tmp/.workspace-sync-marker"
                  touch "$MARKER"
                  sleep 30  # initial delay — let gateway start first
                  CYCLE=0
                  while true; do
                    sleep 15
                    CYCLE=$((CYCLE + 1))

                    # --- Upload: find files modified since last sync ---
                    changed=$(find "$WORKSPACE" -newer "$MARKER" -type f ! -path '*/\.*' 2>/dev/null)
                    if [ -n "$changed" ]; then
                      echo "$changed" | while IFS= read -r filepath; do
                        relpath="${filepath#$WORKSPACE/}"
                        # Skip binary files — only sync text content
                        mimetype=$(file -b --mime-type "$filepath" 2>/dev/null)
                        case "$mimetype" in
                          text/*|application/json|application/xml|application/javascript|application/x-yaml|application/toml) ;;
                          *) continue ;;
                        esac
                        content=$(cat "$filepath" 2>/dev/null) || continue
                        payload=$(jq -n --arg path "$relpath" --arg content "$content" '{path: $path, content: $content}')
                        curl -sf -X POST \
                          -H "Authorization: Bearer $HOOKS_TOKEN" \
                          -H "Content-Type: application/json" \
                          -H "X-Sync-Source: workspace-sync" \
                          -d "$payload" \
                          "$PORTAL_URL/api/internal/workspace" >/dev/null 2>&1 \
                          && echo "[$(date -Iseconds)] workspace-sync: synced $relpath" \
                          || echo "[$(date -Iseconds)] workspace-sync: failed $relpath" >&2
                      done
                      touch "$MARKER"
                    fi

                    # --- Delete reconciliation: every 10 cycles (~2.5 min) ---
                    # Skip files updated in the last 5 minutes to avoid racing with
                    # browser uploads that are still being synced to the pod via k8s exec.
                    if [ $((CYCLE % 10)) -eq 0 ]; then
                      remote_list=$(curl -sf \
                        -H "Authorization: Bearer $HOOKS_TOKEN" \
                        "$PORTAL_URL/api/internal/workspace" 2>/dev/null || true)
                      if [ -n "$remote_list" ] && echo "$remote_list" | jq -e '.files' >/dev/null 2>&1; then
                        now_epoch=$(date +%s)
                        echo "$remote_list" | jq -c '.files[]' | while IFS= read -r _fentry; do
                          rfile=$(echo "$_fentry" | jq -r '.filename')
                          [ -z "$rfile" ] && continue
                          if [ ! -f "$WORKSPACE/$rfile" ]; then
                            # Grace period: don't delete files updated < 5 min ago
                            # (may still be in transit from a browser upload via k8s exec)
                            updated_at=$(echo "$_fentry" | jq -r '.updated_at // empty')
                            if [ -n "$updated_at" ]; then
                              file_epoch=$(date -d "$updated_at" +%s 2>/dev/null || echo 0)
                              age=$((now_epoch - file_epoch))
                              if [ "$age" -lt 300 ]; then
                                continue
                              fi
                            fi
                            curl -sf -X DELETE \
                              -H "Authorization: Bearer $HOOKS_TOKEN" \
                              -H "X-Sync-Source: workspace-sync" \
                              "$PORTAL_URL/api/internal/workspace/by-path?path=$(printf '%s' "$rfile" | jq -sRr @uri)" >/dev/null 2>&1 \
                              && echo "[$(date -Iseconds)] workspace-sync: deleted $rfile" \
                              || echo "[$(date -Iseconds)] workspace-sync: delete failed $rfile" >&2
                          fi
                        done
                      fi
                    fi
                  done
                ) &
                echo "[$(date -Iseconds)] Workspace sync started (2-way, background)"
              fi

              # --- Skills API endpoint (port 18790) ---
              # Reads skills from SKILL.md frontmatter, serves JSON.
              # Written to file to avoid YAML parsing issues with inline Python.
              base64 -d > /tmp/skills-api.py << 'B64'
              {{- $script := `
import http.server, json, os, re, subprocess, urllib.request, urllib.error, ssl, glob, fnmatch
SKILLS_DIR = "/root/.openclaw/skills"
CONFIG_PATH = "/root/.openclaw/openclaw.json"
def get_workspace():
    try:
        with open(CONFIG_PATH) as f:
            return json.load(f).get("agents",{}).get("defaults",{}).get("workspace","")
    except Exception:
        return ""
_ctx = ssl.create_default_context()
_ctx.check_hostname = False
_ctx.verify_mode = ssl.CERT_NONE
UA = "SkillsAPI/1.0"
UNSAFE_PATTERNS = [".env", ".env.*", "*.key", "*.pem", "credentials*", "*.secret", "secrets.*", "node_modules/*", "__pycache__/*"]
def read_config():
    try:
        with open(CONFIG_PATH) as f:
            cfg = json.load(f)
        return cfg.get("channels",{}).get("matrix",{}).get("homeserver",""), cfg.get("channels",{}).get("matrix",{}).get("accessToken","")
    except Exception:
        return "", ""
def parse_skill(d, content):
    fm = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
    if fm:
        meta = {}
        for line in fm.group(1).splitlines():
            kv = line.split(":", 1)
            if len(kv) == 2:
                meta[kv[0].strip()] = kv[1].strip()
        return {"id": d, "name": meta.get("name", d), "description": meta.get("description", ""), "trigger": "/" + d, "userInvocable": meta.get("user-invocable", "false").lower() == "true"}
    title = d
    tm = re.search(r"^#\s+(.+)", content, re.MULTILINE)
    if tm:
        title = tm.group(1).strip()
    caps = []
    cm = re.search(r"##\s+.*(?:Capabilit|Skill|Command|Feature).*\n((?:\s*(?:\d+\.|-|\*)\s+.+\n?)+)", content, re.IGNORECASE)
    if cm:
        for line in cm.group(1).strip().splitlines():
            item = re.sub(r"^\s*(?:\d+\.|-|\*)\s+\*{0,2}", "", line).strip()
            short = item.split(" - ")[0].split(" -- ")[0].strip().rstrip("*")
            if short:
                caps.append(short)
    desc = ", ".join(caps[:6]) if caps else title
    return {"id": d, "name": title, "description": desc, "trigger": "/" + d, "userInvocable": True}
def list_skills():
    skills = []
    seen = set()
    ws = get_workspace()
    # Scan skill directories (subdir/SKILL.md pattern)
    skill_dirs = [SKILLS_DIR]
    if ws:
        skill_dirs.append(os.path.join(ws, ".claude", "skills"))
    for sdir in skill_dirs:
        if not os.path.isdir(sdir):
            continue
        for d in sorted(os.listdir(sdir)):
            if d in seen:
                continue
            p = os.path.join(sdir, d, "SKILL.md")
            if not os.path.isfile(p):
                continue
            seen.add(d)
            with open(p) as f:
                c = f.read()
            skills.append(parse_skill(d, c))
    # Scan command directories (flat .md files)
    if ws:
        cmd_dir = os.path.join(ws, ".claude", "commands")
        if os.path.isdir(cmd_dir):
            for f in sorted(os.listdir(cmd_dir)):
                if not f.endswith(".md"):
                    continue
                name = f[:-3]
                if name in seen:
                    continue
                seen.add(name)
                with open(os.path.join(cmd_dir, f)) as fh:
                    c = fh.read()
                skills.append(parse_skill(name, c))
    return skills
def publish_skills(room_id):
    hs, token = read_config()
    if not hs or not token:
        return 500, "no config"
    skills = [s for s in list_skills() if s.get("userInvocable")] or list_skills()
    encoded = urllib.request.quote(room_id, safe="")
    req = urllib.request.Request(hs + "/_matrix/client/v3/rooms/" + encoded + "/state/dev.clankselect.agent_skills/", json.dumps({"skills": skills}).encode(), method="PUT", headers={"Content-Type": "application/json", "Authorization": "Bearer " + token, "User-Agent": UA})
    try:
        urllib.request.urlopen(req, context=_ctx)
        return 200, "ok"
    except urllib.error.HTTPError as e:
        return e.code, e.read().decode()
def _git_env():
    env = os.environ.copy()
    env["GIT_OPTIONAL_LOCKS"] = "0"
    return env
def _git_run(ws, args, timeout=5):
    return subprocess.run(["git", "-C", ws] + args, capture_output=True, text=True, timeout=timeout, env=_git_env())
def _git_branch(ws):
    return _git_run(ws, ["rev-parse", "--abbrev-ref", "HEAD"]).stdout.strip()
def git_status():
    ws = get_workspace()
    if not ws or not os.path.isdir(os.path.join(ws, ".git")):
        return {"repos": []}
    try:
        branch = _git_branch(ws)
        log_out = _git_run(ws, ["log", "-1", "--format=%h|%s|%at"]).stdout.strip()
        parts = log_out.split("|", 2)
        commit = {"hash": parts[0], "subject": parts[1], "ts": int(parts[2])} if len(parts) == 3 else {"hash": "", "subject": "", "ts": 0}
        porcelain = _git_run(ws, ["status", "--porcelain", "--untracked-files=no"]).stdout
        dirty = len(porcelain.strip()) > 0
        changed = len([l for l in porcelain.strip().splitlines() if l]) if dirty else 0
        ahead, behind = 0, 0
        try:
            ab = _git_run(ws, ["rev-list", "--left-right", "--count", "@{upstream}...HEAD"]).stdout.strip()
            if ab:
                ab_parts = ab.split()
                behind, ahead = int(ab_parts[0]), int(ab_parts[1])
        except Exception:
            pass
        return {"repos": [{"path": ws, "branch": branch, "commit": commit, "dirty": dirty, "changedFiles": changed, "ahead": ahead, "behind": behind}]}
    except Exception:
        return {"repos": []}
def git_pull():
    ws = get_workspace()
    if not ws or not os.path.isdir(os.path.join(ws, ".git")):
        return {"success": False, "output": "Workspace not found or not a git repo", "branch": ""}
    try:
        r = _git_run(ws, ["pull", "--rebase"], timeout=30)
        branch = _git_branch(ws)
        output = (r.stdout + r.stderr).strip()
        return {"success": r.returncode == 0, "output": output, "branch": branch}
    except subprocess.TimeoutExpired:
        return {"success": False, "output": "git pull timed out after 30s", "branch": ""}
    except Exception as e:
        return {"success": False, "output": str(e), "branch": ""}
def _filter_safe_files(ws):
    r = _git_run(ws, ["status", "--porcelain", "--untracked-files=normal"])
    safe, blocked = [], []
    for line in r.stdout.splitlines():
        if len(line) < 4:
            continue
        fpath = line[3:]
        if " -> " in fpath:
            fpath = fpath.split(" -> ", 1)[1]
        fpath = fpath.strip().strip('"')
        is_unsafe = False
        basename = os.path.basename(fpath)
        for pat in UNSAFE_PATTERNS:
            if fnmatch.fnmatch(basename, pat) or fnmatch.fnmatch(fpath, pat):
                is_unsafe = True
                break
        if is_unsafe:
            blocked.append(fpath)
        else:
            safe.append(fpath)
    return safe, blocked
def _pre_commit_checks(ws, files):
    warnings = []
    secret_re = re.compile(r'(PRIVATE KEY|api[_-]?key|api[_-]?secret|password\s*=|token\s*=|AWS_SECRET|BEGIN RSA)', re.IGNORECASE)
    for f in files:
        full = os.path.join(ws, f)
        try:
            sz = os.path.getsize(full)
            if sz > 10 * 1024 * 1024:
                warnings.append({"file": f, "type": "large_file", "detail": f"{sz / 1024 / 1024:.1f} MB"})
        except (OSError, IOError):
            continue
        try:
            with open(full, "rb") as fh:
                head = fh.read(1000)
            if b"\x00" in head[:512]:
                continue
            text = head.decode("utf-8", errors="ignore")
            m = secret_re.search(text)
            if m:
                warnings.append({"file": f, "type": "secret_pattern", "detail": m.group(0)})
        except (OSError, IOError):
            pass
        try:
            with open(full, "rb") as fh:
                chunk = fh.read(50 * 1024)
            text = chunk.decode("utf-8", errors="ignore")
            if "<<<<<<<" in text or ">>>>>>>" in text:
                warnings.append({"file": f, "type": "conflict_markers", "detail": "merge conflict markers"})
        except (OSError, IOError):
            pass
    return warnings
def git_diff():
    ws = get_workspace()
    if not ws or not os.path.isdir(os.path.join(ws, ".git")):
        return {"success": False, "diff": "", "truncated": False}
    try:
        r = _git_run(ws, ["diff", "HEAD"], timeout=5)
        diff_text = r.stdout
        truncated = len(diff_text) > 4000
        if truncated:
            diff_text = diff_text[:4000]
        return {"success": True, "diff": diff_text, "truncated": truncated}
    except Exception:
        return {"success": False, "diff": "", "truncated": False}
def git_dry_run():
    ws = get_workspace()
    if not ws or not os.path.isdir(os.path.join(ws, ".git")):
        return {"success": False, "files": [], "blocked": [], "warnings": [], "diff_stat": "", "branch": ""}
    try:
        safe, blocked = _filter_safe_files(ws)
        warnings = _pre_commit_checks(ws, safe)
        stat_r = _git_run(ws, ["diff", "--stat", "HEAD"])
        branch = _git_branch(ws)
        return {"success": True, "files": safe, "blocked": blocked, "warnings": warnings, "diff_stat": stat_r.stdout.strip(), "branch": branch}
    except Exception as e:
        return {"success": False, "files": [], "blocked": [], "warnings": [], "diff_stat": "", "branch": ""}
def _git_ahead_count(ws):
    try:
        r = _git_run(ws, ["rev-list", "--count", "@{upstream}..HEAD"], timeout=5)
        return int(r.stdout.strip()) if r.returncode == 0 and r.stdout.strip() else 0
    except Exception:
        return 0
def _push_existing_commits(ws, blocked_files, warnings, reason):
    ahead = _git_ahead_count(ws)
    if ahead == 0:
        return {"success": True, "output": reason, "committed": False, "pushed": False, "blocked": blocked_files, "warnings": warnings}
    try:
        push_r = _git_run(ws, ["push"], timeout=30)
        push_out = (push_r.stdout + push_r.stderr).strip()
        if push_r.returncode != 0:
            return {"success": False, "output": f"{reason}; push of {ahead} existing commit(s) failed: {push_out}", "committed": False, "pushed": False, "blocked": blocked_files, "warnings": warnings}
        return {"success": True, "output": f"{reason}; pushed {ahead} existing commit(s): {push_out}", "committed": False, "pushed": True, "blocked": blocked_files, "warnings": warnings}
    except Exception as e:
        return {"success": False, "output": f"{reason}; push failed: {e}", "committed": False, "pushed": False, "blocked": blocked_files, "warnings": warnings}
def git_commit_push(message="chore: sync changes"):
    ws = get_workspace()
    if not ws or not os.path.isdir(os.path.join(ws, ".git")):
        return {"success": False, "output": "Workspace not found or not a git repo", "committed": False, "pushed": False, "blocked": [], "warnings": []}
    output_parts = []
    try:
        safe_files, blocked_files = _filter_safe_files(ws)
        if not safe_files and not blocked_files:
            return _push_existing_commits(ws, [], [], "Nothing to commit")
        if not safe_files and blocked_files:
            return _push_existing_commits(ws, blocked_files, [], "All changed files are blocked by safety filters")
        warnings = _pre_commit_checks(ws, safe_files)
        for i in range(0, len(safe_files), 50):
            batch = safe_files[i:i+50]
            add_r = _git_run(ws, ["add", "--"] + batch, timeout=10)
            output_parts.append(add_r.stdout + add_r.stderr)
            if add_r.returncode != 0:
                return {"success": False, "output": "git add failed: " + (add_r.stdout + add_r.stderr).strip(), "committed": False, "pushed": False, "blocked": blocked_files, "warnings": warnings}
        status_r = _git_run(ws, ["status", "--porcelain"])
        if not status_r.stdout.strip():
            return _push_existing_commits(ws, blocked_files, warnings, "Nothing to commit")
        commit_r = _git_run(ws, ["commit", "-m", message], timeout=10)
        output_parts.append(commit_r.stdout + commit_r.stderr)
        if commit_r.returncode != 0:
            return {"success": False, "output": "git commit failed: " + (commit_r.stdout + commit_r.stderr).strip(), "committed": False, "pushed": False, "blocked": blocked_files, "warnings": warnings}
        push_r = _git_run(ws, ["push"], timeout=30)
        output_parts.append(push_r.stdout + push_r.stderr)
        combined = "\n".join(p.strip() for p in output_parts if p.strip())
        if push_r.returncode != 0:
            return {"success": False, "output": "git push failed: " + combined, "committed": True, "pushed": False, "blocked": blocked_files, "warnings": warnings}
        return {"success": True, "output": combined, "committed": True, "pushed": True, "blocked": blocked_files, "warnings": warnings}
    except subprocess.TimeoutExpired:
        combined = "\n".join(p.strip() for p in output_parts if p.strip())
        return {"success": False, "output": combined + "\nOperation timed out", "committed": False, "pushed": False, "blocked": [], "warnings": []}
    except Exception as e:
        return {"success": False, "output": str(e), "committed": False, "pushed": False, "blocked": [], "warnings": []}
class H(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        if self.path == "/api/skills":
            self._json(200, list_skills())
        elif self.path == "/api/git-status":
            self._json(200, git_status())
        elif self.path == "/api/git-diff":
            self._json(200, git_diff())
        else:
            self._json(404, {"error": "not found"})
    def do_POST(self):
        l = int(self.headers.get("Content-Length", 0))
        b = json.loads(self.rfile.read(l)) if l else {}
        if self.path == "/api/publish-skills":
            rid = b.get("roomId")
            if not rid:
                self._json(400, {"error": "roomId required"})
                return
            c, m = publish_skills(rid)
            self._json(c, {"status": m})
        elif self.path == "/api/git-pull":
            self._json(200, git_pull())
        elif self.path == "/api/git-commit-push":
            msg = b.get("message", "chore: sync changes")
            self._json(200, git_commit_push(msg))
        elif self.path == "/api/git-dry-run":
            self._json(200, git_dry_run())
        else:
            self._json(404, {"error": "not found"})
    def _json(self, code, data):
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Access-Control-Allow-Origin", "*")
        self.end_headers()
        self.wfile.write(json.dumps(data).encode())
