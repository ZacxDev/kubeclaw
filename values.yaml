# -- Agent name. Used for resource naming, namespace suffix, and config defaults.
# @required
agentName: ""

# -- Human-readable display name for the agent in Matrix/config.
# Defaults to "{agentName} Dev" if empty.
agentDisplayName: ""

# -- Number of agent pod replicas. Almost always 1 (the agent holds local
# session state and a single gateway). Set to 0 to provision all resources
# without running the pod ("save for later" / paused agent).
replicaCount: 1

image:
  # -- Container image repository
  repository: your-registry/openclaw
  # -- Container image tag
  tag: latest
  # -- Image pull policy
  pullPolicy: Always

# -- Image pull secrets
imagePullSecrets: []

# -- Git configuration for repo cloning
git:
  # -- Git user email for commits
  email: "agent@devpod.local"
  # -- Git user name for commits
  name: "DevPod Agent"
  # -- Repositories to clone at startup
  # Each entry: { url, path, branch }
  repos: []
  # - url: "git@github.com:user/repo.git"
  #   path: "/data/repos/repo"
  #   branch: "main"

  # -- Background auto-pull loop for workspace repos.
  # Keeps repos in sync with their remote branches without requiring
  # /git pull from Matrix or a pod restart. Safe by design:
  #   - Skips entirely when the working tree is dirty (agent WIP
  #     or untracked files present).
  #   - Only pulls when origin has actually advanced (fetch-then-compare).
  #   - Uses --rebase --autostash on pull (defensive; dirty-skip
  #     already filters WIP).
  #   - Logs only on actual state changes — silent on no-op cycles.
  autoPull:
    # -- Enable the background git auto-pull loop.
    enabled: true
    # -- Interval between auto-pull cycles, in seconds.
    # 300s (5 min) is a reasonable default — fast enough to pick up
    # fresh skill/prompt updates, slow enough to avoid GitHub API pressure.
    intervalSeconds: 300

# -- Agent configuration for openclaw.json
agent:
  # -- Agent ID. Defaults to agentName if empty.
  id: ""
  # -- Workspace directory. Defaults to first repo path or /data/workspace.
  workspace: ""
  # -- Maximum concurrent sessions
  maxConcurrent: 4
  # -- Per-agent default thinking level (off|minimal|low|medium|high).
  # Empty = use OpenClaw's per-model default. Lower this for reasoning models
  # (e.g. deepseek) that otherwise burn their output budget on reasoning and
  # emit empty/incomplete turns ("payloads=0 — surfacing error to user").
  thinkingDefault: ""
  model:
    # -- Primary Claude model
    primary: "anthropic/claude-sonnet-4"
  # -- Matrix mention trigger patterns.
  # Defaults to ["@{agentName}", "{agentName}"] if empty.
  mentionPatterns: []
  # -- Authentication bootstrap for the agent's auth-profiles.json at startup.
  # Selects which credential profile is written to
  # agents/<id>/agent/auth-profiles.json (and agents/main/agent/).
  auth:
    # -- Auth mode:
    #  - "anthropic-oauth" (default): OAuth profile built from the Claude
    #    credentials secret (claude-credentials.json). Original behavior.
    #  - "openrouter": api_key profile built from the OPENROUTER_API_KEY secret
    #    key. Replaces the hand-rolled OpenRouter extraInitCommands every
    #    OpenRouter consumer previously needed (rm Claude creds + jq a profile).
    #  - "apikey": generic api_key profile; set providerName and apiKeyEnv.
    provider: "anthropic-oauth"
    # -- Provider name recorded in the auth profile (api_key modes only).
    # Defaults to "openrouter" when provider is "openrouter".
    providerName: ""
    # -- Profile id key in auth-profiles.json (api_key modes only).
    # Defaults to "<providerName>:default".
    profileId: ""
    # -- Env var (sourced from existingSecret) holding the API key (api_key modes).
    # Defaults to OPENROUTER_API_KEY for "openrouter", otherwise API_KEY.
    apiKeyEnv: ""
  # -- Extra keys merged verbatim into agents.defaults in openclaw.json.
  # The chart renders workspace/model/maxConcurrent/thinkingDefault by default;
  # any additional OpenClaw agent default (e.g. timeoutSeconds) set here is
  # passed through as-is. Previously unknown agent.* keys were silently dropped.
  defaults: {}
  # defaults:
  #   timeoutSeconds: 600

# -- Skill files to mount. Map of filename to content.
# Each skill should include YAML frontmatter (name, description, user-invocable).
# At startup, each file is placed in /root/.openclaw/skills/{name}/SKILL.md.
skills: {}
# promptver-dev.md: |
#   ---
#   name: Promptver Dev
#   description: Development with prompt versioning
#   user-invocable: true
#   ---
#   # Promptver Dev Skill
#   ...

# -- Prune chart-managed skills that were removed from `skills`.
# OPT-IN (default false). When true, the startup script tracks which skill
# directories the chart created (in a manifest at /data/.chart-skills-manifest,
# stored OUTSIDE the skills tree so snapshot restore can't clobber it). On a
# subsequent boot, a skill dir that the chart created previously but is no
# longer in `skills` is deleted. Only chart-managed dirs are ever removed —
# unmanaged, snapshot-restored, or agent-authored skills are NEVER touched.
# Note the second-boot semantics: removing a skill from values takes effect on
# the NEXT pod restart after the manifest recording it was written (first boot
# with an empty manifest prunes nothing, then writes the manifest).
pruneStaleSkills: false

# -- Workspace files to place in the agent's working directory on startup.
# Array of {path, url} objects. Each file is downloaded via curl at startup.
# URLs are typically pre-signed S3 URLs generated by the ClawSail portal.
# Stored as a JSON array in a ConfigMap and downloaded by the startup script.
workspaceFiles: []
# - path: CLAUDE.md
#   url: "http://minio.minio-tenant.svc.cluster.local/clawsail/workspace/abc/CLAUDE.md?X-Amz-..."
# - path: src/config.yaml
#   url: "http://minio.minio-tenant.svc.cluster.local/clawsail/workspace/abc/src/config.yaml?X-Amz-..."

# -- Inline content files to place in the agent's workspace directory on startup.
# Map of relative path to file content. Unlike workspaceFiles (which downloads from URLs),
# this embeds content directly in the Helm values. Ideal for AGENTS.md, CLAUDE.md, etc.
workspaceContent: {}
# AGENTS.md: |
#   # Project Instructions
#   Always use feature branches...
# CLAUDE.md: |
#   # Claude Code Instructions
#   ...

# -- Channel configuration
channels:
  matrix:
    # -- Enable Matrix channel.
    # Default OFF: openclaw 2026.6.x's matrix schema rejects the streamMode /
    # typingIndicator / dm.* keys this chart emits (additionalProperties:false),
    # so a default-on matrix block makes the gateway refuse to start. Re-enabling
    # matrix on 2026.6.x needs the matrix block modernized to the new schema
    # (tracked as a follow-up). Set true only on an openclaw build that accepts
    # the emitted block.
    enabled: false
    # -- Matrix homeserver URL
    homeserver: "https://matrix.example.com"
    # -- Stream mode for responses ("partial" = single message with edits, "" = block streaming)
    streamMode: "partial"
    # -- DM policy
    dm:
      policy: "open"
      allowFrom:
        - "*"
    # -- Group chat policy
    groupPolicy: "open"
    # -- Auto-join behavior
    autoJoin: "always"
    # -- Send typing indicators while agent is processing
    typingIndicator:
      enabled: true
      # -- Typing timeout in ms (refreshed periodically for long operations)
      timeout: 30000
  telegram:
    # -- Enable Telegram channel
    enabled: false
    # -- Pre-approved Telegram user IDs (skips pairing flow)
    allowFrom: []
  discord:
    # -- Enable Discord channel (native OpenClaw support).
    # The bot token is read from the DISCORD_BOT_TOKEN secret env var via
    # OpenClaw's env token source — no jq injection needed.
    enabled: false
    # -- Discord application/client ID (optional; skips a startup REST lookup)
    applicationId: ""
    # -- DM policy: "pairing" (default), "allowlist", "open", or "disabled"
    dmPolicy: "pairing"
    # -- Pre-approved Discord user IDs (DM allowlist; rendered to
    # channels.discord.allowFrom)
    allowFrom: []
    # -- Guild (group) policy: "open", "allowlist" (default), or "disabled"
    groupPolicy: "allowlist"
  whatsapp:
    # -- Enable WhatsApp channel (creates persistent credential storage)
    enabled: false
    # -- DM policy: "pairing" requires QR scan, "open" accepts all
    dmPolicy: "pairing"
    # -- Group chat policy
    groupPolicy: "disabled"
    # -- Send read receipts
    sendReadReceipts: true
    # -- Pre-approved WhatsApp sender IDs (rendered to channels.whatsapp.allowFrom)
    allowFrom: []
  teams:
    # -- Enable Microsoft Teams channel
    enabled: false
    # -- Azure AD application (bot) ID
    appId: ""
    # -- Azure AD tenant ID
    tenantId: ""
  sms:
    # -- Enable SMS channel (Twilio)
    enabled: false
    # -- SMS provider
    provider: "twilio"
    # -- Twilio phone number in E.164 format
    phoneNumber: ""
  email:
    # -- Enable email channel (Mailpit + CronJob poller)
    enabled: false
    # -- Agent email address (auto-generated by portal)
    address: ""
    # -- Mailpit API URL for the email poller CronJob
    mailpitUrl: ""
    # -- Portal service URL for email ingest (routes emails through Clankup for thread tracking).
    # When set, the poller sends emails to the portal instead of directly to the gateway.
    portalUrl: ""

# -- MCP servers registered with OpenClaw.
# Each server runs as a stdio child process of the agent.
#
# The chart emits these under the native `mcp.servers.<name>` config key
# (verified against `openclaw config schema` on 2026.7.1-2 AND 2026.6.1).
# NOTE: the chart historically emitted a top-level `mcpServers` key, which
# BOTH 2026.7.x and 2026.6.1 reject ("<root>: Invalid input") — that is why
# this used to default OFF. The key is now correct, so it can be enabled.
# The stdio `transport` field is intentionally omitted: 2026.6.1's schema
# only allows transport "sse"/"streamable-http" and infers stdio from
# `command`, while 2026.7.x additionally accepts an explicit "stdio".
# Omitting it is accepted by both versions.
mcpServers:
  clankTask:
    # -- Enable the clank-task MCP server (typed task operations).
    # Registers `mcp.servers.clank-task` (stdio child process running
    # /usr/local/bin/clank-task-mcp). Default OFF — enable per agent that
    # needs typed task operations.
    enabled: false

# -- Tools configuration
tools:
  web:
    search:
      # -- Enable web search (rendered to tools.web.search.enabled in
      # openclaw.json). Set false for restricted-egress / hardened agents that
      # don't need web search — it also avoids the web-search plugin's
      # provider-fetch, one of the outbound calls `openclaw doctor --fix` makes
      # at startup that can hang an agent whose egress NetworkPolicy doesn't
      # allowlist the search provider. (Already a first-class value — no
      # agent.defaults passthrough needed.)
      enabled: true
      # -- Search provider
      provider: "brave"
      # -- Max search results
      maxResults: 3

# -- Gateway configuration
gateway:
  # -- Gateway mode
  mode: "local"
  # -- Callback URL for the main openclaw gateway (for result posting).
  # Set to the main openclaw service URL if agents need to report back.
  callbackUrl: ""
  # -- HTTP endpoint settings
  http:
    endpoints:
      # -- Enable OpenAI-compatible POST /v1/chat/completions endpoint.
      # Required for ClawSail built-in chat.
      chatCompletions:
        enabled: true
      # -- Enable OpenAI Responses API POST /v1/responses endpoint.
      # Supports native structured tool calls (tools + tool_choice + function_call output)
      # for deterministic workflow state mutations.
      responses:
        enabled: true

# -- Commands configuration
commands:
  native: "auto"
  nativeSkills: "auto"

# -- Messages configuration
messages:
  ackReactionScope: "all"

# -- Hooks configuration
hooks:
  # -- Enable hooks
  enabled: true
  # -- Allowed sessionKey prefixes for hook mappings. Required by openclaw
  # 2026.5.18+ whenever any hook mapping sessionKey uses templates such as
  # {{timestamp}} or {{from}}. If left empty, the template auto-emits
  # "hook:element:" plus "hook:email:" (when channels.email.enabled).
  allowedSessionKeyPrefixes: []
  # -- Hook mappings array. If empty, a default element hook is generated.
  # Set to a non-empty array to fully override.
  mappings: []
  # - match: { path: "element" }
  #   action: "agent"
  #   wakeMode: "now"
  #   name: "Agent Name"
  #   sessionKey: "hook:element:{{timestamp}}"
  #   messageTemplate: "..."
  #   deliver: false

# -- Name of an existing Secret containing agent tokens/keys.
# Expected keys: MATRIX_ACCESS_TOKEN, TELEGRAM_BOT_TOKEN, HOOKS_TOKEN,
#   GITHUB_TOKEN, BRAVE_API_KEY, ANTHROPIC_API_KEY, git-ssh-key,
#   claude-credentials.json (all optional)
existingSecret: ""

# -- Startup probe configuration
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 30

# -- Namespace configuration
namespace:
  # -- Create the namespace
  create: true

# -- RBAC configuration
rbac:
  # -- Create RBAC resources (Role, RoleBinding, ServiceAccount)
  create: true
  clusterAdmin:
    # -- Create a ClusterRoleBinding to cluster-admin for this agent
    enabled: false
  clusterReadOnly:
    # -- Bind the agent ServiceAccount to the built-in cluster "view"
    # ClusterRole for read-only access across all namespaces. Covers the common
    # read-only diagnostic agent without hand-rolled RBAC. Skipped when
    # clusterAdmin is enabled (superset).
    enabled: false
  orchestrator:
    # -- Create a scoped ClusterRole for cross-namespace agent orchestration.
    # Grants read access to namespaces, pods, pods/log, cronjobs, jobs, and
    # HelmReleases, plus pods/exec create and job create.
    # Skipped when clusterAdmin is enabled (superset).
    enabled: false

# -- Infrastructure tools installation (kubectl, flux, sops, age)
infraTools:
  # -- Install infrastructure tools at startup
  enabled: false
  kubeconfigs:
    # -- Name of existing Secret containing kubeconfig files
    existingSecret: ""

# -- Extra ConfigMaps to create and mount (e.g., agents registry for coordinator)
# Each entry: { name, mountPath, data }
extraConfigMaps: []
# - name: agents-registry
#   mountPath: /config/agents
#   data:
#     agents.json: |
#       { "agents": [...] }

# -- Extra volumes to add to the pod
extraVolumes: []

# -- Extra volume mounts to add to the container
extraVolumeMounts: []

# -- Extra environment variables
extraEnv: []

# -- Extra shell commands to run during container startup, after all standard
# initialization (repo clone, tools install, config generation, auth bootstrap)
# but before the gateway starts. Use for installing project-specific tools.
extraInitCommands: ""

# -- Full openclaw.json override. When set, bypasses all templated config generation.
# The secret fields are still injected via jq at runtime.
rawConfig: {}

# -- openclaw.json lifecycle / integrity behavior.
config:
  # -- What to do when `openclaw doctor --fix` silently reverts openclaw.json
  # to its last-known-good copy (openclaw.json.last-good) because the chart's
  # generated config was rejected as schema-invalid. By default OpenClaw does
  # this silently, so a bad config change looks like it "took" while the agent
  # actually ran the previous config.
  #
  # The startup script hashes openclaw.json before running doctor, then after
  # doctor (and BEFORE the channel-strip, which legitimately rewrites the file)
  # compares the active hash to the pre-doctor hash and to the .last-good hash.
  # A revert is "active == last-good && active != pre".
  #
  #   warn   (default) — emit a loud banner + a structured JSON event, write a
  #                      sentinel file, and continue (agent runs last-good config).
  #   fail            — emit the banner/event, then exit 1 so the container
  #                      CrashLoopBackOffs and Flux/k8s surface it as not-ready.
  #   ignore          — today's silent behavior; no detection, no banner.
  onRevert: "warn"

  # -- Whether OpenClaw checks registry.npmjs.org for OpenClaw + per-plugin
  # updates when the gateway starts and during `openclaw doctor --fix`.
  # Emitted as `update.checkOnStart` in openclaw.json (valid on both
  # openclaw 2026.6.1 and 2026.7.x).
  #
  # DEFAULT false. On openclaw >= 2026.6.11 this update-check does a blocking
  # per-plugin registry fetch (registry.npmjs.org/<pkg>/latest). For hardened
  # agents whose egress NetworkPolicy does NOT allowlist registry.npmjs.org,
  # the fetch has no route and HANGS (per-plugin, ~2.5s each × ~49 stock
  # plugins) → `openclaw doctor --fix` never completes → the gateway never
  # binds :18789 → the pod CrashLoopBackOffs past its startupProbe budget.
  # (Verified 2026-07-25 against openclaw 2026.7.1-2 with the npm registry
  # black-holed: check ON → doctor hangs; check OFF → doctor completes in ~9s
  # and the gateway makes ZERO registry calls.)
  #
  #   false (default) — safe for restricted-egress agents; no npm registry
  #                     calls at startup. Agents won't surface update hints.
  #   true            — original behavior; requires registry.npmjs.org egress
  #                     (allowlist it in the NetworkPolicy) or startup hangs.
  updateCheckOnStart: false

# -- Persistence configuration
persistence:
  # -- Enable persistence
  enabled: false
  # -- Use an existing PVC
  existingClaim: ""
  # -- Storage class (empty = cluster default)
  storageClass: ""
  # -- PVC size
  size: 10Gi
  # -- Access modes
  accessModes:
    - ReadWriteOnce

# -- Container resource requests/limits
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "3Gi"
    cpu: "2000m"

# =============================================================================
# Fleet hardening (securityContext / TLS / NetworkPolicy)
# =============================================================================

# -- Container securityContext, merged verbatim onto the `agent` container.
# DEFAULT = the safe baseline that breaks NO existing agent on upgrade:
#   allowPrivilegeEscalation: false  — blocks setuid privilege escalation.
#   seccompProfile.type: RuntimeDefault — the standard syscall allowlist.
# Neither breaks apt/dpkg/git or the openclaw gateway (verified by gateway-start
# on openclaw 2026.6.1 AND 2026.7.1-2). To ship NO container securityContext
# (pre-0.7.0 behavior) set this to `null` — an empty `{}` does NOT clear it
# (Helm deep-merges maps, so the default keys survive; `null` overrides).
#
# capabilities.drop:["ALL"] is deliberately NOT in the default: it removes
# CHOWN/DAC_OVERRIDE/FOWNER, which breaks `apt-get install` / dpkg at container
# init on images that install packages at runtime (e.g. infraTools, or an
# extraInitCommands apt install). Agents whose runtime deps are BAKED INTO the
# image (no apt-at-init) can opt into the fully-hardened block below.
securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  # --- Fully-hardened example (opt-in — drops ALL Linux capabilities) ---
  # Only safe when the image installs NO packages at runtime (deps baked in).
  # capabilities:
  #   drop: ["ALL"]
  # readOnlyRootFilesystem is NOT recommended: the chart writes to
  # /root/.openclaw|.ssh|.kube|.config and /usr/local/bin at init.

# -- Pod-level securityContext (spec.template.spec.securityContext).
# EMPTY default (`{}`) → no pod securityContext, so nothing changes on upgrade.
# NOTE: do NOT set runAsNonRoot/runAsUser here without reworking the image —
# the startup script hardcodes writes to /root/.openclaw, /root/.ssh, /root/.kube
# and installs binaries into /usr/local/bin, all of which assume UID 0. Provided
# for future non-root work.
podSecurityContext: {}

# -- Outbound TLS verification for Node.js (the openclaw runtime).
tls:
  # -- Verify TLS certificates on outbound connections.
  # false (DEFAULT) → NODE_TLS_REJECT_UNAUTHORIZED=0 (verification OFF — the
  #   chart's historical hardcoded behavior; preserved so no agent breaks on
  #   upgrade). RECOMMENDED to flip to true per-agent.
  # true → NODE_TLS_REJECT_UNAUTHORIZED=1 (verification ON). Agents that hit
  #   only valid-CA endpoints (OpenRouter/GitHub/Matrix/npm) are unaffected.
  #   For an internal self-signed endpoint, mount its CA and point
  #   NODE_EXTRA_CA_CERTS at it via extraEnv rather than turning verify off.
  verify: false

# -- Egress NetworkPolicy for the agent pod. DEFAULT OFF — existing agents run
# with no policy, and a default-deny egress would break them. When enabled the
# chart renders a **CiliumNetworkPolicy** (cilium.io/v2), EGRESS-ONLY (ingress
# stays default-allow so the gateway port-forward and probes keep working).
networkPolicy:
  # -- Enable the egress NetworkPolicy.
  enabled: false
  # -- Render a CiliumNetworkPolicy. REQUIRED (must stay true) whenever enabled:
  # the allowlist uses FQDN egress (toFQDNs), which a plain networking.k8s.io
  # NetworkPolicy CANNOT express. Homelab CNI is Cilium. On a non-Cilium cluster
  # you must hand-author a plain policy outside the chart (setting this false
  # while enabled fails the render with a clear message).
  cilium: true
  egress:
    # -- Always-allow DNS to kube-dns. REQUIRED for toFQDNs (the DNS-visibility
    # `rules.dns` lets Cilium resolve the allowlisted hostnames). Leave true.
    allowKubeDns: true
    # -- kube-dns pod selector (namespace + k8s-app label). Homelab defaults.
    kubeDns:
      namespace: kube-system
      k8sApp: kube-dns
    # -- Always-allow the Kubernetes API server (openclaw runtime / SA token).
    allowKubeApiserver: true
    # -- Extra Cilium entities to allow (e.g. ["cluster"]). Usually empty.
    entities: []
    # -- FQDN egress allowlist. Each entry is a hostname string; one containing
    # `*` renders as a Cilium `matchPattern`, otherwise `matchName`. (A raw
    # Cilium selector map, e.g. {matchName: "x"}, is also passed through.)
    fqdns: []
    #   - "openrouter.ai"
    #   - "*.openrouter.ai"
    #   - "github.com"
    #   - "*.githubusercontent.com"
    # -- Ports applied to the FQDN egress rule.
    fqdnPorts:
      - port: "443"
        protocol: TCP
    # -- In-cluster endpoint egress. Each entry: { namespace, labels{}, ports[] }.
    # Labels are the pod's plain labels (the chart adds Cilium's k8s: prefix).
    endpoints: []
    #   - namespace: mailbox
    #     labels:
    #       app: mailbox-postgres
    #     ports:
    #       - port: "5432"
    #         protocol: TCP

# -- Workflow orchestration image (used by CronJob pods to exec into agent)
workflowImage:
  repository: bitnami/kubectl
  tag: latest

# -- Default settings for all workflows (can be overridden per workflow)
workflowDefaults:
  # -- Per-step timeout in seconds
  timeout: 900
  # -- CronJob concurrency policy
  concurrencyPolicy: Forbid
  # -- Suspend the CronJob
  suspend: false
  # -- Pull git repos before running steps
  gitSync: true
  # -- Number of successful job runs to keep
  successfulJobsHistoryLimit: 3
  # -- Number of failed job runs to keep
  failedJobsHistoryLimit: 3
  # -- Resource requests/limits for workflow CronJob pods
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# -- Workflow definitions. Each key creates a CronJob that orchestrates
# sequential agent steps via kubectl exec into the running agent pod.
# See examples/workflow-product-iteration.yaml for a full example.
workflows: {}
# example-workflow:
#   schedule: "0 10 * * *"
#   timeout: 1800
#   agent: ""
#   gitSync: true
#   concurrencyPolicy: Forbid
#   suspend: false
#   context:
#     CUSTOM_VAR: "value"
#   report:
#     path: "reports/{{workflow}}-{{date}}.md"
#     commit: true
#     branch: "trunk"
#     repo: ""
#   notify:
#     telegram:
#       chatId: ""
#     matrix:
#       enabled: false
#   steps:
#     - name: "step-one"
#       skill: |
#         Do something...
#       timeout: 300
#       notify: false

# -- Snapshot configuration for workspace backup/restore via S3-compatible storage.
# Requires rclone (downloaded automatically at startup when enabled).
snapshots:
  # -- Enable workspace snapshots
  enabled: false
  # -- Storage provider: s3, minio, or r2
  provider: s3
  # -- S3 bucket name
  bucket: ""
  # -- Key prefix in bucket. Defaults to agentName.
  prefix: ""
  # -- Custom endpoint URL (required for minio/r2)
  endpoint: ""
  # -- S3 region
  region: "us-east-1"
  # -- Paths to include in snapshots
  paths:
    - /data/workspace
  # -- Glob patterns to exclude from snapshots (rclone --exclude format)
  exclude:
    - ".git/objects/**"
    - "node_modules/**"
    - "__pycache__/**"
    - ".venv/**"
    - ".terraform/**"
  # -- Path to an exclude-from file on the agent pod (rclone --exclude-from format).
  # If empty, .snapshotignore in each snapshot path root is used automatically when present.
  excludeFrom: ""
  save:
    # -- Cron schedule for automatic snapshots
    schedule: "0 */6 * * *"
    # -- Save a snapshot on pod shutdown (preStop hook)
    onShutdown: true
    # -- Termination grace period in seconds (must exceed expected snapshot duration)
    terminationGracePeriodSeconds: 300
  restore:
    # -- Restore from latest snapshot on startup if workspace is empty
    onStartup: true
  retention:
    # -- Maximum number of snapshots to keep (oldest deleted after successful new save)
    maxCount: 5
  encryption:
    # -- Enable client-side encryption (rclone crypt).
    # Requires SNAPSHOT_ENCRYPTION_PASSWORD in the credentials secret.
    enabled: false
  bandwidth:
    # -- Bandwidth limit for scheduled saves (rclone format, e.g. "10M"). 0 = unlimited.
    # Restore and shutdown saves always run at full speed.
    limit: "0"
  credentials:
    # -- Name of existing Secret containing S3 credentials.
    # Expected keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
    # and optionally SNAPSHOT_ENCRYPTION_PASSWORD (if encryption enabled).
    # If empty, credentials are expected in the main agent secret.
    existingSecret: ""
    # -- Use IAM Roles for Service Accounts (no credential secret needed).
    useIRSA: false

# -- Log shipping sidecars for observability.
logShipping:
  # -- Enable sidecar containers that tail /tmp/openclaw/*.log and
  # stability bundles, emitting them to stdout for cluster log
  # collection (e.g. Grafana Alloy → Loki).
  enabled: false
  image: busybox:1.36
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# -- Pod-level settings
nodeSelector: {}
tolerations: []
affinity: {}
