        {{- if .Values.logShipping.enabled }}
        # --- Log shipping sidecars (opt-in via logShipping.enabled) ---
        # Both tail files into stdout so Grafana Alloy (or any node
        # log collector) picks them up via kubelet's container log path.
        - name: openclaw-log-tailer
          image: {{ .Values.logShipping.image }}
          # Wait for the agent to start writing logs, then exec into
          # `tail -F` so the busybox shell is replaced and the process
          # is reaped cleanly on pod shutdown. Using -F (capital) handles
          # log rotation; -n0 avoids re-emitting historical lines on a
          # tailer restart (which would duplicate them in Loki).
          command:
            - /bin/sh
            - -c
            - |
              while ! ls /tmp/openclaw/openclaw-*.log >/dev/null 2>&1; do
                sleep 2
              done
              exec tail -n0 -F /tmp/openclaw/openclaw-*.log
          volumeMounts:
            - name: openclaw-tmp
              mountPath: /tmp/openclaw
          resources:
            {{- toYaml .Values.logShipping.resources | nindent 12 }}
        - name: stability-bundle-tailer
          image: {{ .Values.logShipping.image }}
          # Stability bundles are written into /root/.openclaw/logs/stability/
          # as JSON files (one per incident). Poll the directory every 5s and
          # emit each new file as a single stdout line wrapping the payload
          # inline. Use a seen-set in an emptyDir so a restart doesn't
          # re-emit everything (which would amplify a real outage).
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/state
              touch /var/state/seen
              # The data PVC is mounted at /root/.openclaw via subPath in
              # the agent; here we mount it directly at the same path
              # (no subPath needed — the bundles live under logs/stability/).
              BUNDLE_DIR=/root/.openclaw/logs/stability
              while true; do
                if [ -d "$BUNDLE_DIR" ]; then
                  for f in "$BUNDLE_DIR"/*.json; do
                    [ -e "$f" ] || continue
                    name=$(basename "$f")
                    if ! grep -Fxq "$name" /var/state/seen 2>/dev/null; then
                      # Inline the JSON payload as a SINGLE stdout line.
                      # `tr -d '\n'` flattens pretty-printed bundles so
                      # Loki sees one event per bundle instead of N lines.
                      # If the file is invalid JSON the outer line will
                      # be invalid too — acceptable; the collector logs
                      # a parse error rather than silently dropping.
                      payload=$(tr -d '\n' < "$f")
                      printf '{"event":"stability_bundle","file":"%s","payload":%s}\n' \
                        "$name" "$payload"
                      echo "$name" >> /var/state/seen
                    fi
                  done
                fi
                sleep 5
              done
          volumeMounts:
            - name: data
              mountPath: /root/.openclaw
              subPath: openclaw
              readOnly: true
            - name: tailer-state
              mountPath: /var/state
          resources:
            {{- toYaml .Values.logShipping.resources | nindent 12 }}
        - name: trajectory-tailer
          image: {{ .Values.logShipping.image }}
          # OpenClaw writes a structured JSONL trajectory per session at
          # /root/.openclaw/agents/<id>/sessions/*.trajectory.jsonl. Each file
          # ends with a single `model.completed` event when the session
          # finishes, containing the full trace (messagesSnapshot with
          # reasoning, toolCalls, usage, promptCache, runId, assistantTexts).
          # That's the bit OpenClaw's /v1/responses strips on the wire — we
          # ship it to Loki for post-hoc reasoning-token analysis +
          # join-by-runId with the bridge's agent_reply log line.
          #
          # Trajectory files are mode 600 root-owned (same trust boundary as
          # stability-bundle-tailer). Mounted readOnly under the same subPath
          # the agent uses, so we see the canonical files without write risk.
          #
          # Watermark scheme: basename#mtime per file. Once a file's
          # mtime advances we re-emit (handles in-progress writes that
          # gain a model.completed event later); rename/rotation produces
          # a fresh basename so no double-emit on the common path.
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/state
              touch /var/state/seen
              while true; do
                for f in /root/.openclaw/agents/*/sessions/*.trajectory.jsonl; do
                  [ -e "$f" ] || continue
                  marker="$(basename "$f")#$(stat -c %Y "$f" 2>/dev/null)"
                  if grep -qxF "$marker" /var/state/seen 2>/dev/null; then
                    continue
                  fi
                  # Emit each model.completed line wrapped in an event envelope
                  # so Alloy's existing devpod-devops pipeline labels it under
                  # event=agent_trajectory. There's typically one per session
                  # but we tolerate N to be safe.
                  grep '"type":"model.completed"' "$f" 2>/dev/null | while IFS= read -r line; do
                    printf '{"event":"agent_trajectory","payload":%s}\n' "$line"
                  done
                  echo "$marker" >> /var/state/seen
                done
                sleep 10
              done
          volumeMounts:
            - name: data
              mountPath: /root/.openclaw
              subPath: openclaw
              readOnly: true
            - name: trajectory-tailer-state
              mountPath: /var/state
          resources:
            {{- toYaml .Values.logShipping.resources | nindent 12 }}
        {{- end }}
